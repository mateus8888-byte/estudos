class=\"kw\" data-q=\"b13q28\">histamina</mark>, <mark class=\"kw\" data-q=\"b13q29\">heparina</mark> e várias outras substâncias nos líquidos locais.</span> <span class=\"sn\" data-s=\"2\">Essas substâncias por sua vez causam aumento do fluxo sanguíneo local, vazamento <mark class=\"kw\" data-q=\"b13q30\">aumentado</mark> de líquido e proteínas plasmáticas para o tecido e outras reações teciduais locais que ajudam a inativar ou a imobilizar o agente antigênico.</span> <span class=\"sn\" data-s=\"3\">Os mesmos fatores têm participação importante na inflamação (discutida no Cap.</span> <span class=\"sn\" data-s=\"4\">33), e na alergia, que discutiremos adiante.</span>","sents":["6. Ativação dos mastócitos e basófilos.","Os fragmentos C3a, C4a e C5a ativam os mastócitos e os basófilos, fazendo com que liberem histamina, heparina e várias outras substâncias nos líquidos locais.","Essas substâncias por sua vez causam aumento do fluxo sanguíneo local, vazamento aumentado de líquido e proteínas plasmáticas para o tecido e outras reações teciduais locais que ajudam a inativar ou a imobilizar o agente antigênico.","Os mesmos fatores têm participação importante na inflamação (discutida no Cap.","33), e na alergia, que discutiremos adiante."],"fig":null,"qs":[{"j":"Os fragmentos <b>C3a</b>, <b>C4a</b> e <b>C5a</b> ativam os mastócitos e os basófilos, fazendo com que liberem histamina, heparina e várias outras substâncias nos líquidos locais.","id":"b13q26","bloco":13,"qn":26,"q":"Quais fragmentos do complemento ativam mastócitos e basófilos?","o":["C5b, C6, C7","C8, C9, B","C3a, C4a, C5a","C1, C2, C3"],"a":2,"ans":"C3a, C4a, C5a","s":1,"notes":[],"orphan":false,"how":"words"},{"j":"6. Ativação dos <b>mastócitos e basófilos</b>.","id":"b13q27","bloco":13,"qn":27,"q":"Quais células liberam histamina após estimulação pelos fragmentos do complemento?","o":["Neutrófilos e macrófagos","Mastócitos e basófilos","Eritrócitos e plaquetas","Linfócitos B e T"],"a":1,"ans":"Mastócitos e basófilos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os fragmentos C3a, C4a e C5a ativam os mastócitos e os basófilos, fazendo com que liberem <b>histamina</b>, heparina e várias outras substâncias nos líquidos locais.","id":"b13q28","bloco":13,"qn":28,"q":"Qual mediador vasoativo é liberado por mastócitos e basófilos ativados?","o":["Perforina","Heparina","Histamina","Interferon"],"a":2,"ans":"Histamina","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Os fragmentos C3a, C4a e C5a ativam os mastócitos e os basófilos, fazendo com que liberem histamina, <b>heparina</b> e várias outras substâncias nos líquidos locais.","id":"b13q29","bloco":13,"qn":29,"q":"Qual substância anticoagulante é liberada junto com histamina na ativação descrita?","o":["Histamina","Heparina","Fibrinogênio","Trombina"],"a":1,"ans":"Heparina","s":1,"notes":[{"k":"rev","t":"A heparina consta entre as substâncias liberadas; sua classificação como anticoagulante não está explicitada no capítulo fornecido.","n":[]}],"orphan":false,"how":"full"},{"j":"Essas substâncias por sua vez causam aumento do fluxo sanguíneo local, vazamento <b>aumentado</b> de líquido e proteínas plasmáticas para o tecido e outras reações teciduais locais que ajudam a inativar ou a imobilizar o agente antigênico.","id":"b13q30","bloco":13,"qn":30,"q":"Qual alteração vascular facilita a saída de proteínas plasmáticas para os tecidos inflamados?","o":["Permeabilidade aumentada","Vasoconstrição","Rigidez da parede capilar","Menor fluxo sanguíneo"],"a":0,"ans":"Permeabilidade aumentada","s":2,"notes":[{"k":"ref","t":"Trecho 79, sobre o aumento do vazamento capilar.","n":[79]}],"orphan":false,"how":"words"}]},{"n":79,"part":2,"title":"Efeitos inflamatórios do complemento","html":"<span class=\"sn\" data-s=\"0\">7. Efeitos inflamatórios.</span> <span class=\"sn\" data-s=\"1\">Além dos efeitos inflamatórios causados pela ativação dos mastócitos e dos basófilos, outros produtos do complemento contribuem para a <mark class=\"kw\" data-q=\"b13q31\">inflamação</mark> local.</span> <span class=\"sn\" data-s=\"2\">Esses produtos fazem com que (1) o fluxo sanguíneo já elevado aumente ainda mais, (2) o vazamento <mark class=\"kw\" data-q=\"b13q33\">capilar</mark> de proteínas aumente ainda mais e (3) as proteínas do líquido intersticial <mark class=\"kw\" data-q=\"b13q32\">coagulem nos espaços teciduais</mark>, impedindo assim o deslocamento do microrganismo invasor pelos tecidos.</span>","sents":["7. Efeitos inflamatórios.","Além dos efeitos inflamatórios causados pela ativação dos mastócitos e dos basófilos, outros produtos do complemento contribuem para a inflamação local.","Esses produtos fazem com que (1) o fluxo sanguíneo já elevado aumente ainda mais, (2) o vazamento capilar de proteínas aumente ainda mais e (3) as proteínas do líquido intersticial coagulem nos espaços teciduais, impedindo assim o deslocamento do microrganismo invasor pelos tecidos."],"fig":null,"qs":[{"j":"Além dos efeitos inflamatórios causados pela ativação dos mastócitos e dos basófilos, outros produtos do complemento contribuem para a <b>inflamação</b> local.","id":"b13q31","bloco":13,"qn":31,"q":"Qual processo local é intensificado pelos produtos do complemento?","o":["Inflamação","Precipitação","Tolerância","Aglutinação"],"a":0,"ans":"Inflamação","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Esses produtos fazem com que (1) o fluxo sanguíneo já elevado aumente ainda mais, (2) o vazamento capilar de proteínas aumente ainda mais e (3) as proteínas do líquido intersticial <b>coagulem nos espaços teciduais</b>, impedindo assim o deslocamento do microrganismo invasor pelos tecidos.","id":"b13q32","bloco":13,"qn":32,"q":"Qual alteração das proteínas do líquido intersticial dificulta a disseminação de microrganismos?","o":["Hemólise","Coagulação","Liquefação","Dissolução"],"a":1,"ans":"Coagulação","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Esses produtos fazem com que (1) o fluxo sanguíneo já elevado aumente ainda mais, (2) o vazamento <b>capilar</b> de proteínas aumente ainda mais e (3) as proteínas do líquido intersticial coagulem nos espaços teciduais, impedindo assim o deslocamento do microrganismo invasor pelos tecidos.","id":"b13q33","bloco":13,"qn":33,"q":"Qual propriedade vascular aumenta o extravasamento de proteínas durante a inflamação?","o":["Viscosidade sanguínea","Frequência cardíaca","Permeabilidade capilar","Pressão arterial"],"a":2,"ans":"Permeabilidade capilar","s":2,"notes":[],"orphan":false,"how":"words"}]},{"n":80,"part":2,"title":"Liberação e recirculação das células T ativadas","html":"<span class=\"sn\" data-s=\"0\">Atributos Especiais do Sistema dos <mark class=\"kw\" data-q=\"b14q1\">Linfócitos</mark> T —Células T <mark class=\"kw\" data-q=\"b14q1\">Ativadas</mark> e Imunidade Mediada por Células Liberação de Células T Ativadas pelo Tecido Linfoide e Formação de Células de Memória.</span> <span class=\"sn\" data-s=\"1\">Com a exposição ao antígeno apropriado feita pelos macrófagos adjacentes, os linfócitos T do clone de linfócitos específicos proliferam e liberam grande número de células T ativadas de reação específica, de modo semelhante à liberação de anticorpos feita pelas células B ativadas.</span> <span class=\"sn\" data-s=\"2\">A principal diferença é que, em vez de liberar anticorpos, células T totalmente ativadas são formadas e liberadas na <mark class=\"kw\" data-q=\"b14q2\">linfa</mark>.</span> <span class=\"sn\" data-s=\"3\">Essas células então passam para a circulação e são distribuídas por todo o corpo, passando através das paredes dos capilares para os tecidos, voltando para a <mark class=\"kw\" data-q=\"b14q2\">linfa</mark> e para o sangue, circulando várias vezes pelo corpo, algumas vezes durante <mark class=\"kw\" data-q=\"b14q3\">meses</mark> ou mesmo <mark class=\"kw\" data-q=\"b14q3\">anos</mark>.</span>","sents":["Atributos Especiais do Sistema dos Linfócitos T —Células T Ativadas e Imunidade Mediada por Células Liberação de Células T Ativadas pelo Tecido Linfoide e Formação de Células de Memória.","Com a exposição ao antígeno apropriado feita pelos macrófagos adjacentes, os linfócitos T do clone de linfócitos específicos proliferam e liberam grande número de células T ativadas de reação específica, de modo semelhante à liberação de anticorpos feita pelas células B ativadas.","A principal diferença é que, em vez de liberar anticorpos, células T totalmente ativadas são formadas e liberadas na linfa.","Essas células então passam para a circulação e são distribuídas por todo o corpo, passando através das paredes dos capilares para os tecidos, voltando para a linfa e para o sangue, circulando várias vezes pelo corpo, algumas vezes durante meses ou mesmo anos."],"fig":null,"qs":[{"j":"Atributos Especiais do Sistema dos <b>Linfócitos</b> T —Células T <b>Ativadas</b> e Imunidade Mediada por Células Liberação de Células T Ativadas pelo Tecido Linfoide e Formação de Células de Memória.","id":"b14q1","bloco":14,"qn":1,"q":"Quais células são liberadas pelos clones T específicos após ativação antigênica?","o":["Linfócitos B","Plasmócitos","Neutrófilos","Linfócitos T ativados"],"a":3,"ans":"Linfócitos T ativados","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"A principal diferença é que, em vez de liberar anticorpos, células T totalmente ativadas são formadas e liberadas na <b>linfa</b>.","id":"b14q2","bloco":14,"qn":2,"q":"Qual líquido corporal recebe inicialmente as células T ativadas liberadas pelo tecido linfoide?","o":["Linfa","Sangue","Líquor","Bile"],"a":0,"ans":"Linfa","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Essas células então passam para a circulação e são distribuídas por todo o corpo, passando através das paredes dos capilares para os tecidos, voltando para a linfa e para o sangue, circulando várias vezes pelo corpo, algumas vezes durante <b>meses</b> ou mesmo <b>anos</b>.","id":"b14q3","bloco":14,"qn":3,"q":"Por quanto tempo algumas células T ativadas podem recircular pelos tecidos?","o":["Dias","Meses ou anos","Minutos ou horas","Algumas semanas"],"a":1,"ans":"Meses ou anos","s":3,"notes":[],"orphan":false,"how":"words"}]},{"n":81,"part":2,"title":"Células T de memória","html":"<span class=\"sn\" data-s=\"0\">Além disso, <mark class=\"kw\" data-q=\"b14q4\">células</mark> de <mark class=\"kw\" data-q=\"b14q4\">memória</mark> de linfócitos T são formadas da mesma forma que as células de memória B são formadas no sistema de anticorpos.</span> <span class=\"sn\" data-s=\"1\">Ou seja, quando um clone de linfócitos T é ativado por antígeno, muitos dos linfócitos recém-formados são preservados no tecido linfoide para se transformarem em linfócitos T adicionais desse clone específico; de fato, essas células de memória se espalham pelo tecido linfoide de todo o corpo.</span> <span class=\"sn\" data-s=\"2\">Portanto, na exposição subsequente ao mesmo antígeno em qualquer local do corpo, a liberação de células T ati vadas ocorre de modo <mark class=\"kw\" data-q=\"b14q5\">muito mais rápido e potente</mark> do que durante a primeira exposição.</span>","sents":["Além disso, células de memória de linfócitos T são formadas da mesma forma que as células de memória B são formadas no sistema de anticorpos.","Ou seja, quando um clone de linfócitos T é ativado por antígeno, muitos dos linfócitos recém-formados são preservados no tecido linfoide para se transformarem em linfócitos T adicionais desse clone específico; de fato, essas células de memória se espalham pelo tecido linfoide de todo o corpo.","Portanto, na exposição subsequente ao mesmo antígeno em qualquer local do corpo, a liberação de células T ati vadas ocorre de modo muito mais rápido e potente do que durante a primeira exposição."],"fig":null,"qs":[{"j":"Além disso, <b>células</b> de <b>memória</b> de linfócitos T são formadas da mesma forma que as células de memória B são formadas no sistema de anticorpos.","id":"b14q4","bloco":14,"qn":4,"q":"Quais células T preservadas permitem resposta mais intensa na reexposição antigênica?","o":["Plasmócitos","Neutrófilos","Células T de memória","Células T supressoras"],"a":2,"ans":"Células T de memória","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Ou seja, quando um clone de linfócitos T é ativado por antígeno, muitos dos linfócitos recém-formados são preservados no tecido linfoide para se transformarem em linfócitos T adicionais desse clone específico; de fato, essas células de memória se espalham pelo tecido linfoide de todo o corpo.","id":"b14q5","bloco":14,"qn":5,"q":"Qual resposta dos linfócitos T é intensificada pela presença de células de memória?","o":["Resposta secundária","Resposta primária","Resposta inata","Resposta passiva"],"a":0,"ans":"Resposta secundária","s":1,"notes":[],"orphan":false,"how":"manual"}]},{"n":82,"part":2,"title":"Reconhecimento antigênico por B e T","html":"<span class=\"sn\" data-s=\"0\">Células Apresentadoras de Antígeno, Proteínas <mark class=\"kw\" data-q=\"b14q8\">MHC</mark> e Receptores de Antígenos nos <mark class=\"kw\" data-q=\"b14q7\">Linfócitos T</mark>.</span> <span class=\"sn\" data-s=\"1\">As respostas das células T são extremamente específicas para antígenos, como as respostas dos anticorpos das células B, e são pelo menos tão importantes quanto os anticorpos na defesa contra infecções.</span> <span class=\"sn\" data-s=\"2\">De fato, as respostas imunes adquiridas, em geral, necessitam da assistência das células T para iniciar o processo, e as células T têm papel importante na eliminação dos patógenos invasores.</span> <span class=\"sn\" data-s=\"3\">Apesar de os <mark class=\"kw\" data-q=\"b14q6\">linfócitos B</mark> reconhecerem antígenos intactos, os <mark class=\"kw\" data-q=\"b14q7\">linfócitos T</mark> só respondem aos antígenos quando eles se ligam a moléculas específicas, chamadas proteínas <mark class=\"kw\" data-q=\"b14q8\">MHC</mark>, na superfície das células apresentadoras de antígenos, nos tecidos linfoides (Fig.</span> <span class=\"sn\" data-s=\"4\">34-7).</span>","sents":["Células Apresentadoras de Antígeno, Proteínas MHC e Receptores de Antígenos nos Linfócitos T.","As respostas das células T são extremamente específicas para antígenos, como as respostas dos anticorpos das células B, e são pelo menos tão importantes quanto os anticorpos na defesa contra infecções.","De fato, as respostas imunes adquiridas, em geral, necessitam da assistência das células T para iniciar o processo, e as células T têm papel importante na eliminação dos patógenos invasores.","Apesar de os linfócitos B reconhecerem antígenos intactos, os linfócitos T só respondem aos antígenos quando eles se ligam a moléculas específicas, chamadas proteínas MHC, na superfície das células apresentadoras de antígenos, nos tecidos linfoides (Fig.","34-7)."],"fig":null,"qs":[{"j":"Apesar de os <b>linfócitos B</b> reconhecerem antígenos intactos, os linfócitos T só respondem aos antígenos quando eles se ligam a moléculas específicas, chamadas proteínas MHC, na superfície das células apresentadoras de antígenos, nos tecidos linfoides (Fig.","id":"b14q6","bloco":14,"qn":6,"q":"Quais linfócitos reconhecem antígenos intactos?","o":["Macrófagos","Linfócitos T","Linfócitos B","Células T citotóxicas"],"a":2,"ans":"Linfócitos B","s":3,"notes":[],"orphan":false,"how":"full"},{"j":"Células Apresentadoras de Antígeno, Proteínas MHC e Receptores de Antígenos nos <b>Linfócitos T</b>.","id":"b14q7","bloco":14,"qn":7,"q":"Quais linfócitos necessitam de apresentação antigênica associada ao MHC?","o":["Linfócitos B","Neutrófilos","Linfócitos T","Plasmócitos"],"a":2,"ans":"Linfócitos T","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Apesar de os linfócitos B reconhecerem antígenos intactos, os linfócitos T só respondem aos antígenos quando eles se ligam a moléculas específicas, chamadas proteínas <b>MHC</b>, na superfície das células apresentadoras de antígenos, nos tecidos linfoides (Fig.","id":"b14q8","bloco":14,"qn":8,"q":"Qual complexo molecular participa da apresentação de antígenos aos linfócitos T?","o":["Imunoglobulina","MHC","Interleucina","Complemento"],"a":1,"ans":"MHC","s":3,"notes":[],"orphan":false,"how":"full"}]},{"n":83,"part":2,"title":"Células apresentadoras e aderência celular","html":"<span class=\"sn\" data-s=\"0\">Os três principais tipos de <mark class=\"kw\" data-q=\"b14q10 b14q14\">células</mark> que apresentam <mark class=\"kw\" data-q=\"b14q13\">antígenos</mark> são os <mark class=\"kw\" data-q=\"b14q11\">macrófagos</mark>, os <mark class=\"kw\" data-q=\"b14q12\">linfócitos B</mark> e as células <mark class=\"kw\" data-q=\"b14q10\">dendríticas</mark>.</span> <span class=\"sn\" data-s=\"1\">As células dendríticas, as células apresentadoras de antígenos mais potentes, se localizam em todo o corpo e sua única função conhecida é a de apresentar os antígenos às células T.</span> <span class=\"sn\" data-s=\"2\">A interação das proteínas de aderência celular é crítica para permitir a ligação das células T às células apresentadoras de antígenos durante tempo suficiente para que elas se tornem ativadas.</span>","sents":["Os três principais tipos de células que apresentam antígenos são os macrófagos, os linfócitos B e as células dendríticas.","As células dendríticas, as células apresentadoras de antígenos mais potentes, se localizam em todo o corpo e sua única função conhecida é a de apresentar os antígenos às células T.","A interação das proteínas de aderência celular é crítica para permitir a ligação das células T às células apresentadoras de antígenos durante tempo suficiente para que elas se tornem ativadas."],"fig":null,"qs":[{"j":"Os três principais tipos de <b>células</b> que apresentam antígenos são os macrófagos, os linfócitos B e as células <b>dendríticas</b>.","id":"b14q10","bloco":14,"qn":10,"q":"Qual célula apresentadora de antígenos é descrita como a mais potente?","o":["Macrófago","Linfócito B","Célula dendrítica","Neutrófilo"],"a":2,"ans":"Célula dendrítica","s":0,"no ras linfocinas têm efeitos menos potentes.</span>","sents":["Estimulação do Crescimento e Proliferação das Células T Citotóxicas e Supressoras.","Na ausência de células T auxiliares, os clones para a produção de células T citotóxicas e supressoras são pouco ativados pela maioria dos antígenos.","A linfocina interleucina-2 tem efeito estimulador, especialmente intenso, para o crescimento e a proliferação das células T citotóxicas e supressoras.","Além disso, várias outras linfocinas têm efeitos menos potentes."],"fig":null,"qs":[{"j":"A linfocina <b>interleucina-2</b> tem efeito estimulador, especialmente intenso, para o crescimento e a proliferação das células T citotóxicas e supressoras.","id":"b15q11","bloco":15,"qn":11,"q":"Qual interleucina estimula intensamente a proliferação de células T citotóxicas?","o":["Interleucina-6","Interleucina-4","Interleucina-1","Interleucina-2"],"a":3,"ans":"Interleucina-2","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"A linfocina <b>interleucina-2</b> tem efeito estimulador, especialmente intenso, para o crescimento e a proliferação das células T citotóxicas e supressoras.","id":"b15q12","bloco":15,"qn":12,"q":"Qual interleucina estimula o crescimento de células T supressoras no mecanismo descrito?","o":["Interleucina-4","Interleucina-1","Interleucina-6","Interleucina-2"],"a":3,"ans":"Interleucina-2","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"A linfocina <b>interleucina-2</b> tem efeito estimulador, especialmente intenso, para o crescimento e a proliferação das células T citotóxicas e supressoras.","id":"b15q15","bloco":15,"qn":15,"q":"Qual interleucina exerce estímulo proliferativo especialmente intenso sobre células T?","o":["IL-6","IL-2","IL-4","IL-1"],"a":1,"ans":"IL-2","s":2,"notes":[],"orphan":false,"how":"manual"}]},{"n":91,"part":2,"title":"Estimulação das células B","html":"<span class=\"sn\" data-s=\"0\">Estimulação do Crescimento das Células B e Diferenciação para Formar <mark class=\"kw\" data-q=\"b15q20\">Plasmócitos</mark> e <mark class=\"kw\" data-q=\"b15q21\">Anticorpos</mark>.</span> <span class=\"sn\" data-s=\"1\">As ações diretas do antígeno para causar o crescimento de células B, a proliferação, a formação de <mark class=\"kw\" data-q=\"b15q20\">plasmócitos</mark> e a secreção de <mark class=\"kw\" data-q=\"b15q21\">anticorpos</mark> também são pouco intensas sem o “auxílio&quot; das células T auxiliares.</span> <span class=\"sn\" data-s=\"2\">Quase todas as interleucinas participam da resposta das células B, mas especialmente as <mark class=\"kw\" data-q=\"b15q16 b15q17 b15q18 b15q19\">interleucinas 4, 5 e 6</mark>.</span> <span class=\"sn\" data-s=\"3\">De fato, essas três interleucinas exercem efeitos tão potentes sobre as células B que são chamadas de fatores estimulantes das células B ou fatores de crescimento das células B.</span>","sents":["Estimulação do Crescimento das Células B e Diferenciação para Formar Plasmócitos e Anticorpos.","As ações diretas do antígeno para causar o crescimento de células B, a proliferação, a formação de plasmócitos e a secreção de anticorpos também são pouco intensas sem o “auxílio&quot; das células T auxiliares.","Quase todas as interleucinas participam da resposta das células B, mas especialmente as interleucinas 4, 5 e 6.","De fato, essas três interleucinas exercem efeitos tão potentes sobre as células B que são chamadas de fatores estimulantes das células B ou fatores de crescimento das células B."],"fig":null,"qs":[{"j":"Quase todas as interleucinas participam da resposta das células B, mas especialmente as <b>interleucinas 4, 5 e 6</b>.","id":"b15q16","bloco":15,"qn":16,"q":"Quais interleucinas têm efeitos importantes sobre o crescimento e diferenciação das células B?","o":["IL-4, IL-5, IL-6","IL-3, IL-7, IL-8","IL-1, IL-2, IL-3","IL-1, IL-3, IL-9"],"a":0,"ans":"IL-4, IL-5, IL-6","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Quase todas as interleucinas participam da resposta das células B, mas especialmente as <b>interleucinas 4, 5 e 6</b>.","id":"b15q17","bloco":15,"qn":17,"q":"Qual interleucina identificada pelo número 4 participa intensamente da estimulação das células B?","o":["IL-7","IL-3","IL-1","IL-4"],"a":3,"ans":"IL-4","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Quase todas as interleucinas participam da resposta das células B, mas especialmente as <b>interleucinas 4, 5 e 6</b>.","id":"b15q18","bloco":15,"qn":18,"q":"Qual interleucina identificada pelo número 5 é destacada entre os fatores estimulantes das células B?","o":["IL-7","IL-1","IL-5","IL-3"],"a":2,"ans":"IL-5","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Quase todas as interleucinas participam da resposta das células B, mas especialmente as <b>interleucinas 4, 5 e 6</b>.","id":"b15q19","bloco":15,"qn":19,"q":"Qual interleucina identificada pelo número 6 participa da diferenciação e resposta das células B?","o":["IL-1","IL-6","IL-7","IL-3"],"a":1,"ans":"IL-6","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Estimulação do Crescimento das Células B e Diferenciação para Formar <b>Plasmócitos</b> e Anticorpos.","id":"b15q20","bloco":15,"qn":20,"q":"Em quais células os linfócitos B podem se diferenciar após estímulo das linfocinas?","o":["Mastócitos","Linfoblastos","Macrófagos","Plasmócitos"],"a":3,"ans":"Plasmócitos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Estimulação do Crescimento das Células B e Diferenciação para Formar Plasmócitos e <b>Anticorpos</b>.","id":"b15q21","bloco":15,"qn":21,"q":"Qual produto imunológico é secretado após a diferenciação das células B estimuladas?","o":["Perforinas","Interleucinas","Histamina","Anticorpos"],"a":3,"ans":"Anticorpos","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":92,"part":2,"title":"Retenção e ativação dos macrófagos","html":"<span class=\"sn\" data-s=\"0\">Ativação do Sistema de <mark class=\"kw\" data-q=\"b15q22\">Macrófagos</mark>. Os linfócitos também afetam os <mark class=\"kw\" data-q=\"b15q22\">macrófagos</mark>.</span> <span class=\"sn\" data-s=\"1\">Primeiro, eles <mark class=\"kw\" data-q=\"b15q24\">retardam ou interrompem a migração dos macrófagos</mark> depois de serem atraídos por quimiotaxia para a área de tecido inflamada, causando grande acúmulo de macrófagos.</span> <span class=\"sn\" data-s=\"2\">Segundo, eles ativam os macrófagos para produzir <mark class=\"kw\" data-q=\"b15q23\">fagocitose</mark> mais eficiente, permitindo que eles ataquem e destruam número cada vez maior de bactérias invasoras ou de outros agentes destruidores de tecidos.</span>","sents":["Ativação do Sistema de Macrófagos. Os linfócitos também afetam os macrófagos.","Primeiro, eles retardam ou interrompem a migração dos macrófagos depois de serem atraídos por quimiotaxia para a área de tecido inflamada, causando grande acúmulo de macrófagos.","Segundo, eles ativam os macrófagos para produzir fagocitose mais eficiente, permitindo que eles ataquem e destruam número cada vez maior de bactérias invasoras ou de outros agentes destruidores de tecidos."],"fig":null,"qs":[{"j":"Ativação do Sistema de <b>Macrófagos</b>. Os linfócitos também afetam os <b>macrófagos</b>.","id":"b15q22","bloco":15,"qn":22,"q":"Quais células fagocíticas são ativadas pelas linfocinas das células T auxiliares?","o":["Plasmócitos","Neutrófilos","Mastócitos","Macrófagos"],"a":3,"ans":"Macrófagos","s":0,"notes":[{"k":"ref","t":"Trechos 87 e 88, sobre os mediadores das células T auxiliares.","n":[87,88]}],"orphan":false,"how":"full"},{"j":"Segundo, eles ativam os macrófagos para produzir <b>fagocitose</b> mais eficiente, permitindo que eles ataquem e destruam número cada vez maior de bactérias invasoras ou de outros agentes destruidores de tecidos.","id":"b15q23","bloco":15,"qn":23,"q":"Qual processo fagocitário é intensificado após a ativação dos macrófagos?","o":["Precipitação","Aglutinação","Fagocitose","Pinocitose"],"a":2,"ans":"Fagocitose","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Primeiro, eles <b>retardam ou interrompem a migração dos macrófagos</b> depois de serem atraídos por quimiotaxia para a área de tecido inflamada, causando grande acúmulo de macrófagos.","id":"b15q24","bloco":15,"qn":24,"q":"Qual fenômeno favorece o acúmulo de macrófagos na região inflamada após sua chegada por quimiotaxia?","o":["Aglutinação","Retenção local","Quimiotaxia","Opsonização"],"a":1,"ans":"Retenção local","s":1,"notes":[],"orphan":false,"how":"manual"}]},{"n":93,"part":2,"title":"Feedback positivo das células auxiliares","html":"<span class=\"sn\" data-s=\"0\">Efeito de Feedback Estimulante sobre as Próprias Células Auxiliares.</span> <span class=\"sn\" data-s=\"1\">Algumas linfocinas, especialmente a <mark class=\"kw\" data-q=\"b15q13\">interleucina-2</mark>, exercem efeito de <mark class=\"kw\" data-q=\"b15q14\">feedback positivo</mark> direto de estimular a ativação das próprias células T auxiliares.</span> <span class=\"sn\" data-s=\"2\">Esse feedback atua como amplificador, aumentando ainda mais a resposta das células auxiliares, bem como toda a resposta imune contra o antígeno invasor.</span>","sents":["Efeito de Feedback Estimulante sobre as Próprias Células Auxiliares.","Algumas linfocinas, especialmente a interleucina-2, exercem efeito de feedback positivo direto de estimular a ativação das próprias células T auxiliares.","Esse feedback atua como amplificador, aumentando ainda mais a resposta das células auxiliares, bem como toda a resposta imune contra o antígeno invasor."],"fig":null,"qs":[{"j":"Algumas linfocinas, especialmente a <b>interleucina-2</b>, exercem efeito de feedback positivo direto de estimular a ativação das próprias células T auxiliares.","id":"b15q13","bloco":15,"qn":13,"q":"Qual mediador é especialmente importante no estímulo proliferativo das próprias células T auxiliares?","o":["Interferon-gama","Interleucina-1","Interleucina-4","Interleucina-2"],"a":3,"ans":"Interleucina-2","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Algumas linfocinas, especialmente a interleucina-2, exercem efeito de <b>feedback positivo</b> direto de estimular a ativação das próprias células T auxiliares.","id":"b15q14","bloco":15,"qn":14,"q":"Qual mecanismo de autorregulação amplia a ativação das células T auxiliares?","o":["Feedback positivo","Supressão imunológica","Feedback negativo","Tolerância"],"a":0,"ans":"Feedback positivo","s":1,"notes":[],"orphan":false,"how":"full"}]},{"n":94,"part":2,"title":"Células T citotóxicas ou killer","html":"<span class=\"sn\" data-s=\"0\">As <mark class=\"kw\" data-q=\"b16q1\">Células T </mark><mark class=\"kw\" data-q=\"b16q1 b16q3\">Citotóxicas</mark> São <mark class=\"kw\" data-q=\"b16q2\">Células Killer</mark> A célula T citotóxica é célula de ataque direto, capaz de matar microrganismos e algumas vezes até mesmo as células do próprio corpo.</span> <span class=\"sn\" data-s=\"1\">Por esse motivo, elas são chamadas de <mark class=\"kw\" data-q=\"b16q2\">células killer</mark>.</span> <span class=\"sn\" data-s=\"2\">As <mark class=\"kw\" data-q=\"b16q4\">proteínas receptoras</mark> na superfície das células citotóxicas fazem com que elas se liguem fortemente aos organismos ou células que contenham o antígeno de ligação específico apropriado.</span> <span class=\"sn\" data-s=\"3\">A seguir, elas destroem a célula atacada pelo modo mostrado na Figura 34-9.</span>","sents":["As Células T Citotóxicas São Células Killer A célula T citotóxica é célula de ataque direto, capaz de matar microrganismos e algumas vezes até mesmo as células do próprio corpo.","Por esse motivo, elas são chamadas de células killer.","As proteínas receptoras na superfície das células citotóxicas fazem com que elas se liguem fortemente aos organismos ou células que contenham o antígeno de ligação específico apropriado.","A seguir, elas destroem a célula atacada pelo modo mostrado na Figura 34-9."],"fig":null,"qs":[{"j":"As <b>Células T Citotóxicas</b> São Células Killer A célula T citotóxica é célula de ataque direto, capaz de matar microrganismos e algumas vezes até mesmo as células do próprio corpo.","id":"b16q1","bloco":16,"qn":1,"q":"Quais células T são responsáveis pelo ataque direto e destruição de células-alvo?","o":["Células T auxiliares","Células T citotóxicas","Células T supressoras","Linfócitos B"],"a":1,"ans":"Células T citotóxicas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"As Células T Citotóxicas São <b>Células Killer</b> A célula T citotóxica é célula de ataque direto, capaz de matar microrganismos e algumas vezes até mesmo as células do próprio corpo.","id":"b16q2","bloco":16,"qn":2,"q":"Qual outro nome é atribuído às células T citotóxicas?","o":["Células helper","Células reguladoras","Células plasmáticas","Células killer"],"a":3,"ans":"Células killer","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"As Células T <b>Citotóxicas</b> São Células Killer A célula T citotóxica é célula de ataque direto, capaz de matar microrganismos e algumas vezes até mesmo as células do próprio corpo.","id":"b16q3","bloco":16,"qn":3,"q":"Quais linfócitos são conhecidos como células killer no mecanismo de imunidade celular adquirida?","o":["Linfócitos T auxiliares","Linfócitos B","Linfócitos T citotóxicos","Linfócitos T supressores"],"a":2,"ans":"Linfócitos T citotóxicos","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"As <b>proteínas receptoras</b> na superfície das células citotóxicas fazem com que elas se liguem fortemente aos organismos ou células que contenham o antígeno de ligação específico apropriado.","id":"b16q4","bloco":16,"qn":4,"q":"Qual estrutura permite a ligação específica da célula T citotóxica ao alvo?","o":["Anticorpos livres","Proteínas receptoras","Complemento","Perforinas"],"a":1,"ans":"Proteínas receptoras","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":95,"part":2,"title":"Perforinas e destruição da célula-alvo","html":"<span class=\"sn\" data-s=\"0\">Depois da ligação, a <mark class=\"kw\" data-q=\"b16q7 b16q9 b16q10\">célula</mark> T citotóxica secreta proteínas produtoras de orifícios, chamadas <mark class=\"kw\" data-q=\"b16q5 b16q6\">perforinas</mark>, que literalmente perfuram orifícios redondos na <mark class=\"kw\" data-q=\"b16q7\">membrana</mark> da célula atacada.</span> <span class=\"sn\" data-s=\"1\">A seguir, o <mark class=\"kw\" data-q=\"b16q8\">líquido</mark> flui do espaço <mark class=\"kw\" data-q=\"b16q8\">intersticial</mark> com muita rapidez para a célula.</span> <span class=\"sn\" data-s=\"2\">Além disso, as células T citotóxicas liberam substâncias citotóxicas diretamente nas células atacadas.</span> <span class=\"sn\" data-s=\"3\">Quase que de imediato essa célula atacada fica muito inchada, dissolvendo-se em pouco tempo.</span>","sents":["Depois da ligação, a célula T citotóxica secreta proteínas produtoras de orifícios, chamadas perforinas, que literalmente perfuram orifícios redondos na membrana da célula atacada.","A seguir, o líquido flui do espaço intersticial com muita rapidez para a célula.","Além disso, as células T citotóxicas liberam substâncias citotóxicas diretamente nas células atacadas.","Quase que de imediato essa célula atacada fica muito inchada, dissolvendo-se em pouco tempo."],"fig":null,"qs":[{"j":"Depois da ligação, a célula T citotóxica secreta proteínas produtoras de orifícios, chamadas <b>perforinas</b>, que literalmente perfuram orifícios redondos na membrana da célula atacada.","id":"b16q5","bloco":16,"qn":5,"q":"Quais proteínas secretadas pelas células T citotóxicas formam orifícios nas membranas celulares?","o":["Imunoglobulinas","Perforinas","Linfocinas","Interleucinas"],"a":1,"ans":"Perforinas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Depois da ligação, a célula T citotóxica secreta proteínas produtoras de orifícios, chamadas <b>perforinas</b>, que literalmente perfuram orifícios redondos na membrana da célula atacada.","id":"b16q6","bloco":16,"qn":6,"q":"Qual é o nome das proteínas responsáveis pela perfuração da membrana da célula-alvo?","o":["Linfocinas","Imunoglobulinas","Interleucinas","Perforinas"],"a":3,"ans":"Perforinas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Depois da ligação, a <b>célula</b> T citotóxica secreta proteínas produtoras de orifícios, chamadas perforinas, que literalmente perfuram orifícios redondos na <b>membrana</b> da célula atacada.","id":"b16q7","bloco":16,"qn":7,"q":"Qual estrutura celular sofre perfuração pela ação das perforinas?","o":["Membrana celular","Mitocôndria","Parede celular","Núcleo celular"],"a":0,"ans":"Membrana celular","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"A seguir, o <b>líquido</b> flui do espaço <b>intersticial</b> com muita rapidez para a célula.","id":"b16q8","bloco":16,"qn":8,"q":"Qual líquido entra rapidamente na célula-alvo após a formação de orifícios?","o":["Bile","Plasma","Líquido intersticial","Líquor"],"a":2,"ans":"Líquido intersticial","s":1,"notes":[],"orphan":false,"how":"words"},{"j":"Depois da ligação, a <b>célula</b> T citotóxica secreta proteínas produtoras de orifícios, chamadas perforinas, que literalmente perfuram orifícios redondos na membrana da célula atacada.","id":"b16q9","bloco":16,"qn":9,"q":"Qual alteração volumétrica ocorre na célula-alvo após o influxo de líquido?","o":["Perda de volume","Condensação do núcleo","Intumescimento celular","Retração celular"],"a":2,"ans":"Intumescimento celular","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Depois da ligação, a <b>célula</b> T citotóxica secreta proteínas produtoras de orifícios, chamadas perforinas, que literalmente perfuram orifícios redondos na membrana da célula atacada.","id":"b16q10","bloco":16,"qn":10,"q":"Qual processo encerra a destruição da célula-alvo após a ação citotóxica descrita?","o":["Dissolução celular","Divisão celular","Fagocitose","Opsonização"],"a":0,"ans":"Dissolução celular","s":0,"notes":[],"orphan":false,"how":"words"}]},{"n":96,"part":2,"title":"Desprendimento e ataques sucessivos","html":"<span class=\"sn\" data-s=\"0\"> ulas T citotóxicas são especialmente letais para as células dos tecidos que foram invadidas por vírus porque várias partículas virais ficam retidas nas membranas das células teciduais, atraindo as células T em resposta à antigenicidade virótica.","As células citotóxicas também participam de modo importante da destruição de células cancerígenas, células cardíacas transplantadas e de outros tipos de células estranhas ao corpo da própria pessoa."],"fig":null,"qs":[{"j":"Algumas das células T <b>citotóxicas</b> são especialmente letais para as células dos tecidos que foram invadidas por vírus porque várias partículas virais ficam retidas nas membranas das células teciduais, atraindo as células T em resposta à antigenicidade virótica.","id":"b16q12","bloco":16,"qn":12,"q":"Qual população de linfócitos T destrói especialmente células infectadas por vírus?","o":["Linfócitos T citotóxicos","Plasmócitos","Linfócitos B","Linfócitos T supressores"],"a":0,"ans":"Linfócitos T citotóxicos","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Algumas das <b>células T citotóxicas</b> são especialmente letais para as células dos tecidos que foram invadidas por vírus porque várias partículas virais ficam retidas nas membranas das células teciduais, atraindo as células T em resposta à antigenicidade virótica.","id":"b16q13","bloco":16,"qn":13,"q":"Quais células T participam da destruição de células cancerígenas?","o":["Plasmócitos","Células T supressoras","Células T citotóxicas","Células T auxiliares"],"a":2,"ans":"Células T citotóxicas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Algumas das células T citotóxicas são especialmente letais para as células dos <b>tecidos</b> que foram invadidas por vírus porque várias partículas virais ficam retidas nas membranas das células teciduais, atraindo as células T em resposta à antigenicidade virótica.","id":"b16q14","bloco":16,"qn":14,"q":"Qual tipo de tecido transplantado é citado como alvo da atividade citotóxica?","o":["Tecido hepá a <mark class=\"kw\" data-q=\"b16q19\">tolerância imune</mark>, discutida na próxima seção.</span>","sents":["Células T Supressoras Pouco se sabe sobre as células T supressoras, mas elas são capazes de suprimir as funções tanto das células T citoFigura 34-9 Destruição direta de célula invasora pelos linfócitos sensibilizados (células T citotóxicas). tóxicas quanto das células T auxiliares.","Acredita-se que essas funções supressoras sirvam ao propósito de evitar que as células citotóxicas causem reações imunológicas excessivas que possam ser prejudiciais aos tecidos do corpo.","Por esse motivo as células supressoras são classificadas, juntamente com as células T auxiliares, como células T reguladoras.","É provável que o sistema das células T supressoras tenha papel importante na limitação da capacidade do sistema imune de atacar os tecidos da própria pessoa, a chamada tolerância imune, discutida na próxima seção."],"fig":null,"qs":[{"j":"<b>Células T Supressoras</b> Pouco se sabe sobre as <b>células T supressoras</b>, mas elas são capazes de suprimir as funções tanto das células T citoFigura 34-9 Destruição direta de célula invasora pelos linfócitos sensibilizados (células T citotóxicas). tóxicas quanto das células T auxiliares.","id":"b16q16","bloco":16,"qn":16,"q":"Quais linfócitos T reduzem a atividade das células citotóxicas e auxiliares?","o":["Células T auxiliares","Células T citotóxicas","Células T supressoras","Plasmócitos"],"a":2,"ans":"Células T supressoras","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"<b>Células T Supressoras</b> Pouco se sabe sobre as <b>células T supressoras</b>, mas elas são capazes de suprimir as funções tanto das células T citoFigura 34-9 Destruição direta de célula invasora pelos linfócitos sensibilizados (células T citotóxicas). tóxicas quanto das células T auxiliares.","id":"b16q17","bloco":16,"qn":17,"q":"Qual população de células T é responsável pela supressão de respostas imunológicas excessivas no modelo descrito?","o": "kw\" data-q=\"b17q1 b17q2\">Tolerância</mark> do Sistema de <mark class=\"kw\" data-q=\"b17q2\">Imunidade</mark> Adquirida aos Tecidos da Própria Pessoa — O Papel do Pré-processamento noTimo e na Medula Óssea Se a pessoa ficasse imune aos seus próprios tecidos, o processo da imunidade adquirida poderia destruir suas células.</span> <span class=\"sn\" data-s=\"1\">O mecanismo imune normalmente “reconhece” os tecidos da própria pessoa como sendo diferentes de bactérias e vírus, e o sistema imune dessa pessoa forma poucos anticorpos ou células T ativadas contra seus <mark class=\"kw\" data-q=\"b17q3\">próprios antígenos</mark>.</span>","sents":["Tolerância do Sistema de Imunidade Adquirida aos Tecidos da Própria Pessoa — O Papel do Pré-processamento noTimo e na Medula Óssea Se a pessoa ficasse imune aos seus próprios tecidos, o processo da imunidade adquirida poderia destruir suas células.","O mecanismo imune normalmente “reconhece” os tecidos da própria pessoa como sendo diferentes de bactérias e vírus, e o sistema imune dessa pessoa forma poucos anticorpos ou células T ativadas contra seus próprios antígenos."],"fig":null,"qs":[{"j":"<b>Tolerância</b> do Sistema de Imunidade Adquirida aos Tecidos da Própria Pessoa — O Papel do Pré-processamento noTimo e na Medula Óssea Se a pessoa ficasse imune aos seus próprios tecidos, o processo da imunidade adquirida poderia destruir suas células.","id":"b17q1","bloco":17,"qn":1,"q":"Como se chama a capacidade do sistema imune de evitar ataques aos próprios tecidos?","o":["Autoimunidade","Tolerância imunológica","Anafilaxia","Hipersensibilidade"],"a":1,"ans":"Tolerância imunológica","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"<b>Tolerância</b> do Sistema de <b>Imunidade</b> Adquirida aos Tecidos da Própria Pessoa — O Papel do Pré-processamento noTimo e na Medula Óssea Se a pessoa ficasse imune aos seus próprios tecidos, o processo da imunidade adquirida poderia destruir suas células.","id":"b17q2","bloco":17,"qn":2,"q":"Qual mecanismo diferencia os tecidos próprios dos agentes invasores e limita respostas contra autoantígenos?","o":["Anafilaxia","Autoimunidade","Tolerância imune","Hipersensibilidade"],"a":2,"ans":"Tolerância imune","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"O mecanismo imune normalmente “reconhece” os tecidos da própria pessoa como sendo diferentes de bactérias e vírus, e o sistema imune dessa pessoa forma poucos anticorpos ou células T ativadas contra seus <b>próprios antígenos</b>.","id":"b17q3","bloco":17,"qn":3,"q":"Como são chamados os antígenos pertencentes ao próprio organismo?","o":["Alérgenos","Epítopos virais","Autoantígenos","Toxinas"],"a":2,"ans":"Autoantígenos","s":1,"notes":[{"k":"ref","t":"Trecho 27, que nomeia os autoantígenos dos tecidos corporais.","n":[27]}],"orphan":false,"how":"manual"}]},{"n":100,"part":2,"title":"Seleção de clones e desenvolvimento da tolerância","html":"<span class=\"sn\" data-s=\"0\">Grande Parte da Tolerância Resulta da <mark class=\"kw\" data-q=\"b17q7\">Seleção</mark> de <mark class=\"kw\" data-q=\"b17q7\">Clones</mark> durante o Pré-processamento.</span> <span class=\"sn\" data-s=\"1\">Acredita-se que grande parte da tolerância se desenvolva durante o pré-processamento dos linfócitos T no timo, e dos linfócitos B na <mark class=\"kw\" data-q=\"b17q6\">medula óssea</mark>.</span> <span class=\"sn\" data-s=\"2\">O motivo para essa crença se baseia no fato de que a injeção de antígeno potente em <mark class=\"kw\" data-q=\"b17q9\">feto</mark>, enquanto os linfócitos estão sendo pré-processados nessas duas áreas, impede o desenvolvimento de clones de linfócitos no tecido linfoide que sejam específicos para o antígeno injetado.</span> <span class=\"sn\" data-s=\"3\">Experimentos mostraram que linfócitos imaturos específicos no <mark class=\"kw\" data-q=\"b17q5\">timo</mark> quando expostos a antígeno potente tornam-se linfoblásticos, proliferam de forma considerável, e, depois, combinam-se com o antígeno estimulan enos</mark> A <mark class=\"kw\" data-q=\"b18q3\">imunização</mark> foi utilizada durante muitos anos para produzir imunidade adquirida contra doenças específicas.</span> <span class=\"sn\" data-s=\"1\">A pessoa pode ser imunizada pela injeção de microrganismos <mark class=\"kw\" data-q=\"b18q4\">mortos</mark> que não sejam mais capazes de causar doença, mas que podem apresentar parte de seus <mark class=\"kw\" data-q=\"b18q8\">antígenos</mark> químicos.</span> <span class=\"sn\" data-s=\"2\">Esse tipo de <mark class=\"kw\" data-q=\"b18q3\">imunização</mark> é utilizado para a proteção contra a <mark class=\"kw\" data-q=\"b18q5\">febre tifoide</mark>, <mark class=\"kw\" data-q=\"b18q6\">coqueluche</mark>, <mark class=\"kw\" data-q=\"b18q7\">difteria</mark> e muitos outros tipos de doenças bacterianas.</span>","sents":["Imunização pela Injeção de Antígenos A imunização foi utilizada durante muitos anos para produzir imunidade adquirida contra doenças específicas.","A pessoa pode ser imunizada pela injeção de microrganismos mortos que não sejam mais capazes de causar doença, mas que podem apresentar parte de seus antígenos químicos.","Esse tipo de imunização é utilizado para a proteção contra a febre tifoide, coqueluche, difteria e muitos outros tipos de doenças bacterianas."],"fig":null,"qs":[{"j":"<b>Imunização</b> pela Injeção de Antígenos A <b>imunização</b> foi utilizada durante muitos anos para produzir imunidade adquirida contra doenças específicas.","id":"b18q3","bloco":18,"qn":3,"q":"Qual processo consiste em administrar antígenos para induzir proteção adquirida?","o":["Opsonização","Imunização","Aglutinação","Fagocitose"],"a":1,"ans":"Imunização","s":0,"notes":[{"k":"ref","t":"Trechos 107 e 108, sobre as outras modalidades de imunização.","n":[107,108]}],"orphan":false,"how":"full"},{"j":"A pessoa pode ser imunizada pela injeção de microrganismos <b>mortos</b> que não sejam mais capazes de causar doença, mas que podem apresentar parte de seus antígenos quími [],"orphan":false,"how":"manual"},{"j":"Esse procedimento é utilizado para a proteção contra <b>poliomielite</b>, febre amarela, sarampo, catapora e muitas outras doenças virais.","id":"b18q16","bloco":18,"qn":16,"q":"Qual doença viral caracterizada por paralisia aparece entre os exemplos de imunização por microrganismos atenuados?","o":["Hepatite","Dengue","Poliomielite","Raiva"],"a":2,"ans":"Poliomielite","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Esse procedimento é utilizado para a proteção contra poliomielite, <b>febre amarela</b>, sarampo, catapora e muitas outras doenças virais.","id":"b18q17","bloco":18,"qn":17,"q":"Qual doença viral transmitida por mosquitos é citada entre os exemplos de imunização com microrganismos atenuados?","o":["Poliomielite","Febre amarela","Sarampo","Caxumba"],"a":1,"ans":"Febre amarela","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Esse procedimento é utilizado para a proteção contra poliomielite, febre amarela, <b>sarampo</b>, catapora e muitas outras doenças virais.","id":"b18q18","bloco":18,"qn":18,"q":"Qual doença viral exantemática é mencionada entre os exemplos de imunização com agentes atenuados?","o":["Tétano","Febre amarela","Sarampo","Poliomielite"],"a":2,"ans":"Sarampo","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Esse procedimento é utilizado para a proteção contra poliomielite, febre amarela, sarampo, <b>catapora</b> e muitas outras doenças virais.","id":"b18q19","bloco":18,"qn":19,"q":"Qual outra doença viral com lesões cutâneas vesiculares aparece entre os exemplos de imunização com agentes atenuados?","o":["Catapora","Tétano","Poliomielite","Febre amarela"],"a":0,"ans":"Catapora","s":2,"notes":[{"k":"rev","t":"Nas questões 16 a 19 do Bloco 18, as doenças constam no capítulo, mas as características “paralisia”, “transmitida por mosquitos”, “exantemática” e “lesões cutâneas vesiculares” não são apresentadas para esses exemplos.","n":[]}],"orphan":false,"how":"full"}]},{"n":109,"part":2,"title":"Imunidade ativa","html":"<span class=\"sn\" data-s=\"0\">Imunidade Passiva Até este ponto, toda a imunidade adquirida que se discutiu foi do tipo <mark class=\"kw\" data-q=\"b18q1 b18q2\">imunidade ativa</mark>.</span> <span class=\"sn\" data-s=\"1\">Ou seja, o próprio corpo da pessoa desenvolve anticorpos ou células T ativadas em resposta à invasão de seu corpo por um antígeno estranho.</span>","sents":["Imunidade Passiva Até este ponto, toda a imunidade adquirida que se discutiu foi do tipo imunidade ativa.","Ou seja, o próprio corpo da pessoa desenvolve anticorpos ou células T ativadas em resposta à invasão de seu corpo por um antígeno estranho."],"fig":null,"qs":[{"j":"Imunidade Passiva Até este ponto, toda a imunidade adquirida que se discutiu foi do tipo <b>imunidade ativa</b>.","id":"b18q1","bloco":18,"qn":1,"q":"Como se chama a imunidade na qual o próprio organismo forma anticorpos ou linfócitos T ativados?","o":["Imunidade inata","Imunidade ativa","Imunidade passiva","Imunidade natural"],"a":1,"ans":"Imunidade ativa","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Imunidade Passiva Até este ponto, toda a imunidade adquirida que se discutiu foi do tipo <b>imunidade ativa</b>.","id":"b18q2","bloco":18,"qn":2,"q":"Qual imunidade se desenvolve pela resposta do próprio organismo a um antígeno?","o":["Imunidade ativa","Imunidade inata","Imunidade humoral","Imunidade passiva"],"a":0,"ans":"Imunidade ativa","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":110,"part":2,"title":"Transferência de componentes imunológicos","html":"<span class=\"sn\" data-s=\"0\">Entretanto, pode ser produzida <mark class=\"kw\" data-q=\"b18q21 b18q22 b18q28\">imunidade</mark> temporária em uma pessoa sem a injeção de qualquer antígeno.</span> <span class=\"sn\" data-s=\"1\">Isso é feito pela infusão de <mark class=\"kw\" data-q=\"b18q23\">anticorpos</mark>, células T <mark class=\"kw\" data-q=\"b18q24\">ativadas</mark> ou ambos, obtidos do sangue de outra pessoa ou de outro anim function stripSVG(spec){

    let x=(maxW-layout[ri])/2, y=ri*RH;

        const cx=x+CW/2, cy=y+56;
        if(tok==='>') g+='<path d="M'+(cx-12)+' '+cy+'H'+(cx+10)+'M'+(cx+3)+' '+(cy-8)+'L'+(cx+11)+' '+cy+'L'+(cx+3)+' '+(cy+8)+'" class="ln-ink" style="stroke-width:4"/>';

        if(tok==='=') g+='<path d="M'+(cx-10)+' '+(cy-5)+'H'+(cx+10)+'M'+(cx-10)+' '+(cy+5)+'H'+(cx+10)+'" class="ln-ink" style="stroke-width:4"/>';
        if(tok==='|') g+='<path d="M'+(cx-14)+' '+cy+'H'+(cx+4)+'M'+(cx+10)+' '+(cy-12)+'V'+(cy+12)+'" class="ln-bad" style="stroke-width:5"/>';
        x+=CW; return;
      }

}

  const box=(x,y,w,h,t,c,sub,dim)=>'<g class="'+(dim?'dim':'')+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" class="fl-'+c+'"/><text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+5))+'" class="lbl">'+t+'</text>'+(sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+14)+'" class="lbl2" style="text-anchor:middle">'+sub+'</text>':'')+'</g>';
  const arrow=(x0,y0,x1,y1)=>'<path d="M'+x0+' '+y0+'L'+x1+' '+y1+'" class="ln-ink" style="stroke-width:3"/>';
  const dm = k=>focus!=='all' && focus!==k;
  return '<svg viewBox="0 0 580 330" role="img" aria-label="Esquema da cascata do complemento">'
  +box(10,20,130,56,'Antígeno + anticorpo','def','via clássica',dm('start'))
  +arrow(140,48,170,48)+box(170,20,70,56,'C1','gold','',dm('start'))
  +arrow(240,48,270,48)+box(270,20,80,56,'C4, C2','gold','',dm('amp'))
  +arrow(350,48,380,48)+box(380,20,70,56,'C3','gold','',dm('amp'))
  +arrow(450,48,480,48)+box(480,20,90,56,'C5 → C9','gold','',dm('amp'))
  +'<path d="M415 76V120M525 76V226H500" class="ln-ink" style="stroke-width:3"/>'
  +box(330,120,170,52,'C3b: opsonização','ok','neutrófilos e macrófagos',dm('all')&&false)
  +box(10,120,150,52,'C3a, C4a, C5a','org','mastócitos → histamina',false)
  +box(170,120,150,52,'C5a: quimiotaxia','tea','atrai fagócitos',false)
  +box(330,200,170,52,'C5b6789: lise','bad','rompe a membrana',false)
  +box(10,200,150,52,'Aglutinação','vio','microrganismos grudam',false)
  +box(170,200,150,52,'Neutralização','pnk','alguns vírus',false)
  +'<text x="290" y="290" class="lblb" style="text-anchor:middle;fill:var(--ink-2)">Cerca de 20 proteínas; as principais: C1 a C9, B e D</text>'
  +'<text x="290" y="312" class="lbl2" style="text-anchor:middle">A cascata amplifica: um pequeno início gera uma reação muito grande</text>'
  +'</svg>';
}

   ========================================================== */
function drawTop(){
  const sc=score(), done=answeredCount();
  top.innerHTML='<span class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z" style="fill:var(--def)"/><path d="M10.5 7h3v3.5H17v3h-3.5V17h-3v-3.5H7v-3h3.5z" fill="#fff"/></svg>Leitura ativa<span class="t2"> · Cap. 34</span></span>'
   +'<span class="pill" title="Pontos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z" style="fill:var(--gold)"/></svg><span>'+sc+' pts</span></span>'
   +'<span class="pill cnt" title="Perguntas respondidas">'+done+' / '+TOTALQ+'</span>'
   +'<button class="gbtn" data-act="index">Índice</button>'
   +'<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+TOTALQ+'" aria-valuenow="'+done+'"><i style="width:'+Math.round(done/TOTALQ*100)+'%"></i></div>';
}
function figHTML(t){
  if(t.fig) return '<figure class="fig"><button class="imgbtn" data-act="zoom" data-src="'+t.fig+'" aria-label="Ampliar a ilustração"><img src="'+t.fig+'" alt="Ilustração do slide correspondente a este trecho" onerror="this.closest(\'figure\').hidden=true"></button><figcaption>Ilustração do seu material (slide '+t.n+'). Toque para ampliar.</figcaption></figure>';
  if(FIG[t.n]) return '<figure class="fig"><div class="svgbox">'+FIG[t.n].s()+'</div><figcaption>'+FIG[t.n].c+'</figcaption></figure>';
  if(ILL[t.n]) return '<figure class="fig"><div class="svgbox">'+stripSVG(ILL[t.n])+'</div><figcaption>Esquema ilustrativo do trecho.</figcaption></figure>';
  return '';
}
function qCard(q,i){
  const st=S.ans[q.id];
  const lab=(q.orphan?'Sem correspondência no capítulo':'Bloco '+q.bloco+' · Questão '+q.qn);
  let opts=q.o.map((o,k)=>'<button class="opt'+(st&&k===q.a?' yes':'')+'" data-act="pick" data-q="'+q.id+'" data-k="'+k+'" '+(st?'disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>').join('');
  return '<div class="qc'+(st?' done':'')+'" id="qc-'+q.id+'" data-q="'+q.id+'">'
   +'<div class="qmeta"><span>'+(i+1)+'</span><span>'+lab+'</span><span class="st">'+(st?(st.p+' pts'):'')+'</span></div>'
   +'<p class="qtext">'+esc(q.q)+'</p>'
   +'<div class="opts">'+opts+'</div>'
   +'<div class="tools" '+(st?'hidden':'')+'><button class="hbtn" data-act="hint" data-q="'+q.id+'">Dica</button><span class="hmsg" id="hm-'+q.id+'"></span><span class="msg bad" id="ms-'+q.id+'"></span></div>'
   +'<div id="ju-'+q.id+'">'+(st?justHTML(q):'')+'</div>'
   +'</div>';
}
function justHTML(q){
  let h='<div class="just"><span class="jt">Por que está certo</span><blockquote>'+(q.how==='none'?'Esta resposta não aparece no texto deste trecho. A resposta registrada no material é <b>'+esc(q.ans)+'</b>.':'“'+q.j+'”')+'</blockquote>';
  q.notes.forEach(n=>{
    if(n.k==='ref'){ h+='<div class="chips"><span class="note" style="background:none;padding:0">Veja também:</span>'+n.n.map(x=>'<button class="chip" data-act="go" data-n="'+x+'">Trecho '+x+'</button>').join('')+'</div>'; }
    else h+='<div class="note">Nota do material: '+esc(n.t)+'</div>';
  });
  return h+'</div>';
}
function view(){
  const t=D[S.cur];
  drawTop();
  const done=tAnswered(t), total=t.qs.length;
  const intro = (S.cur===0 && S.intro) ? '<div class="how"><b>Como funciona</b><span>1. Leia o trecho: as palavras-chave aparecem marcadas em amarelo.</span><span>2. Responda às perguntas logo abaixo. A <b>Dica</b> mostra a frase do texto, depois as primeiras letras e, por fim, elimina duas opções.</span><span>3. Ao acertar, você vê por que a resposta está certa. Depois vá para o próximo trecho.</span><button class="gbtn" style="align-self:flex-start" data-act="hideintro">Entendi</button></div>' : '';
  const last = S.cur===D.length-1;
  app.innerHTML='<article class="reader">'
    +'<header><p class="eyebrow">Parte '+t.part+' · Trecho '+t.n+' de '+D.length+'</p><h1>'+esc(t.title)+'</h1></header>'
    +intro
    +figHTML(t)
    +'<div class="passage" id="passage">'+t.html+'</div>'
    +(total?'<section><div class="qhead"><h2>Perguntas sobre este trecho</h2><span class="qcount" id="qcount">'+done+' de '+total+'</span></div><div class="qlist" id="qlist">'+t.qs.map(qCard).join('')+'</div></section>'
           :'<div class="noq">Este trecho não tem perguntas próprias. Leia com atenção: o conteúdo aparece nas perguntas dos trechos vizinhos.</div>')
    +'<nav class="rnav"><button class="btn alt" data-act="prev" '+(S.cur===0?'disabled':'')+'>Trecho anterior</button><button class="btn '+(done===total?'good':'')+'" data-act="next">'+(last?'Concluir':'Próximo trecho')+'</button></nav>'
    +'</article>';
  window.scrollTo(0,0);
}

function endView(){
  drawTop();
  const rev=[]; D.forEach(t=>t.qs.forEach(q=>{ const a=S.ans[q.id]; if(a&&(a.w>0||a.h>0)) rev.push([t,q,a]); }));
  const skipped=[]; D.forEach(t=>t.qs.forEach(q=>{ if(!S.ans[q.id]) skipped.push([t,q]); }));
  const first=Object.values(S.ans).filter(a=>a.w===0&&a.h===0).length;
  app.innerHTML='<article class="reader"><div class="end"><h1>Capítulo concluído</h1>'
   +'<p>Você chegou ao fim dos 134 trechos.</p>'
   +'<div class="tiles"><div class="tile"><b>'+score()+'</b><span>pontos</span></div><div class="tile"><b>'+first+'</b><span>de primeira, sem dica</span></div><div class="tile"><b>'+answeredCount()+'/'+TOTALQ+'</b><span>respondidas</span></div></div>'
   +(rev.length?'<h2>Para revisar ('+rev.length+')</h2><p class="muted">Perguntas em que você errou ou usou dica. Toque para voltar ao trecho.</p><ul class="revl">'+rev.slice(0,60).map(r=>'<li><button data-act="go" data-n="'+r[0].n+'">Trecho '+r[0].n+'</button> · '+esc(r[1].q)+'</li>').join('')+'</ul>':'')
   +(skipped.length?'<h2>Ainda sem resposta ('+skipped.length+')</h2><ul class="revl">'+skipped.slice(0,40).map(r=>'<li><button data-act="go" data-n="'+r[0].n+'">Trecho '+r[0].n+'</button> · '+esc(r[1].q)+'</li>').join('')+'</ul>':'')
   +'<div class="rnav" style="width:100%;justify-content:center"><button class="btn alt" data-act="go" data-n="1">Voltar ao início</button><button class="btn" data-act="reset">Zerar progresso</button></div>'
   +'</div></article>';
  window.scrollTo(0,0);
}
function drawer(){
  let h='<h2>Índice dos trechos</h2><button class="gbtn" style="align-self:flex-start" data-act="closeidx">Fechar</button>';
  let part=0;
  D.forEach((t,i)=>{
    if(t.part!==part){ part=t.part; h+='<p class="ph">Parte '+part+'</p>'; }
    const d=tAnswered(t), n=t.qs.length;
    h+='<button class="ti'+(i===S.cur?' cur':'')+(n&&d===n?' all':'')+'" data-act="go" data-n="'+t.n+'"><span class="n">'+t.n+'</span><span>'+esc(t.title)+'</span><span class="d">'+(n?d+'/'+n:'só leitura')+'</span></button>';
  });
  $('#panel').innerHTML=h;
}

/* ==========================================================
   AÇÕES
   ========================================================== */
function getQ(id){ for(const t of D) for(const q of t.qs) if(q.id===id) return q; return null; }
function setActive(id){
  document.querySelectorAll('.qc.act').forEach(e=>e.classList.remove('act'));
  document.querySelectorAll('mark.kw.on').forEach(e=>e.classList.remove('on'));
  if(!id) return;
  const c=document.getElementById('qc-'+id); if(c) c.classList.add('act');
  document.querySelectorAll('mark.kw').forEach(m=>{ if((' '+m.dataset.q+' ').indexOf(' '+id+' ')>=0) m.classList.add('on'); });
}
let toastT=null;
function toast(msg,btn,fn){
  const el=$('#toast'); el.innerHTML='<span>'+msg+'</span>'+(btn?'<button id="tbtn">'+btn+'</button>':''); el.hidden=false;
  if(btn){ const b=$('#tbtn'); b.onclick=function(){ fn&&fn(); el.hidden=true; }; }
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; },6000);
}
const A={
  index(){ drawer(); $('#drawer').hidden=false; },
  closeidx(){ $('#drawer').hidden=true; },
  go(el){ const n=+el.dataset.n; S.cur=D.findIndex(t=>t.n===n); if(S.cur<0) S.cur=0; save(); $('#drawer').hidden=true; view(); },
  next(){ if(S.cur>=D.length-1){ endView(); return; } S.cur++; save(); view(); },
  prev(){ if(S.cur>0){ S.cur--; save(); view(); } },
  hideintro(){ S.intro=false; save(); const h=document.querySelector('.how'); if(h) h.remove(); },
  zoom(el){ $('#lbimg').src=el.dataset.src; $('#lightbox').hidden=false; },
  reset(el){
    if(!el.dataset.armed){ el.dataset.armed='1'; el.textContent='Toque de novo para zerar tudo'; return; }
    S={cur:0,ans:{},intro:true}; hintState={}; triesState={}; save(); view();
  },
  pick(el){
    const q=getQ(el.dataset.q), k=+el.dataset.k;
    if(S.ans[q.id]||el.disabled) return;
    setActive(q.id);
    if(k===q.a){
      const h=hintState[q.id]||0, w=triesState[q.id]||0;
      let p=10-3*h-(w>0?3:0); p=Math.max(p,w>0||h>0?2:10);
      S.ans[q.id]={p:p,h:h,w:w}; save();
      const card=document.getElementById('qc-'+q.id);
      card.classList.add('done');
      card.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===q.a) b.classList.add('yes'); });
      card.querySelector('.tools').hidden=true;
      card.querySelector('.qmeta .st').textContent=p+' pts';
      $('#ju-'+q.id).innerHTML=justHTML(q);
      const t=D[S.cur]; const c=$('#qcount'); if(c) c.textContent=tAnswered(t)+' de '+t.qs.length;
      drawTop();
      if(tAnswered(t)===t.qs.length){ const nb=document.querySelector('[data-act=next]'); if(nb) nb.classList.add('good'); }
    } else {
      triesState[q.id]=(triesState[q.id]||0)+1;
      el.classList.add('no','shake'); el.disabled=true;
      $('#ms-'+q.id).textContent='Ainda não. Releia o trecho marcado ou use a dica.';
    }
  },
  hint(el){
    const q=getQ(el.dataset.q); if(S.ans[q.id]) return;
    setActive(q.id);
    const lvl=(hintState[q.id]||0)+1; hintState[q.id]=lvl;
    const hm=$('#hm-'+q.id);
    if(lvl===1){
      if(q.how==='none'){ hm.textContent='Esta resposta não está no texto deste trecho.'; }
      else {
        const sn=document.querySelector('.passage .sn[data-s="'+q.s+'"]');
        if(sn){
          sn.classList.add('flash'); setTimeout(()=>sn.classList.remove('flash'),4200);
          const r=sn.getBoundingClientRect(); const topH=document.querySelector('.top').offsetHeight;
          const visible = r.top>topH+8 && r.bottom<window.innerHeight-8;
          hm.textContent='A pista está na frase destacada do texto.';
          if(!visible){
            const card=document.getElementById('qc-'+q.id);
            sn.scrollIntoView({block:'center',behavior:'smooth'});
            toast('Frase destacada no texto','Voltar à pergunta',()=>card.scrollIntoView({block:'center',behavior:'smooth'}));
          }
        }
      }
    } else if(lvl===2){
      const a=q.o[q.a]; const nw=a.trim().split(/\s+/).length;
      hm.textContent='Começa com “'+a.slice(0,Math.min(3,a.length))+'…” · '+nw+(nw>1?' palavras':' palavra');
    } else {
      const card=document.getElementById('qc-'+q.id); let rem=0;
      card.querySelectorAll('.opt').forEach((b,j)=>{ if(j!==q.a&&!b.disabled&&rem<2){ b.classList.add('out'); b.disabled=true; rem++; } });
      hm.textContent='Duas opções erradas foram eliminadas.'; el.disabled=true;
    }
  }
};
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');
  if(el){ const f=A[el.dataset.act]; if(f) f(el); return; }
  const c=e.target.closest('.qc'); if(c) setActive(c.dataset.q);
  if(e.target.id==='drawer') $('#drawer').hidden=true;
  if(e.target.closest('#lightbox')) $('#lightbox').hidden=true;
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ $('#drawer').hidden=true; $('#lightbox').hidden=true; } });

view();
})();
</script>

</body></html>
