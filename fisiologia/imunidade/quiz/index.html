m quais animais foi inicialmente identificado o órgão especializado de pré-processamento dos linfócitos B?","o":["Répteis","Mamíferos","Peixes","Aves"],"a":3,"ans":"Aves","s":1,"notes":[],"orphan":false,"how":"full"}]},{"n":25,"part":1,"title":"Necessidade de diferenciação dos linfócitos","html":"<span class=\"sn\" data-s=\"0\">A Figura 34-1 mostra os dois sistemas de linfócitos para a formação, respectivamente, dos linfócitos T ativados (1) e dos anticorpos (2).</span> <span class=\"sn\" data-s=\"1\">Pré-processamento dos Linfócitos T e B Apesar de os linfócitos do corpo se originarem de células-tronco comprometidas com linfócitos do embrião, essas células-tronco propriamente ditas são incapazes de formar de modo direto linfócitos T ativados ou anticorpos.</span> <span class=\"sn\" data-s=\"2\">Antes disso, elas devem se diferenciar ainda mais nas áreas de processamento apropriadas como descrito a seguir.</span>","sents":["A Figura 34-1 mostra os dois sistemas de linfócitos para a formação, respectivamente, dos linfócitos T ativados (1) e dos anticorpos (2).","Pré-processamento dos Linfócitos T e B Apesar de os linfócitos do corpo se originarem de células-tronco comprometidas com linfócitos do embrião, essas células-tronco propriamente ditas são incapazes de formar de modo direto linfócitos T ativados ou anticorpos.","Antes disso, elas devem se diferenciar ainda mais nas áreas de processamento apropriadas como descrito a seguir."],"fig":"figs/f25.jpg","qs":[]},{"n":26,"part":1,"title":"Processamento, diversidade e disseminação dos linfócitos T","html":"<span class=\"sn\" data-s=\"0\">O <mark class=\"kw\" data-q=\"b5q4\">Timo</mark> Processa os Linfócitos T. Os linfócitos T, após sua origem na medula óssea, migram primeiramente para o <mark class=\"kw\" data-q=\"b5q4\">timo</mark>.</span> <span class=\"sn\" data-s=\"1\">Aí eles se dividem rapidamente e ao mesmo tempo desenvolvem diversidade extrema para reagir contra diferentes antígenos específicos.</span> <span class=\"sn\" data-s=\"2\">Ou seja, um linfócito tímico desenvolve reatividade específica contra um antígeno.</span> <span class=\"sn\" data-s=\"3\">O linfócito seguinte desenvolve <mark class=\"kw\" data-q=\"b5q6\">especificidade</mark> contra outro antígeno.</span> <span class=\"sn\" data-s=\"4\">Esse processo continua até que existam milhares de tipos diferentes de linfócitos tímicos com reatividades específicas contra muitos milhares de Imunidade <mark class=\"kw\" data-q=\"b5q7\">Celular</mark> Figura 34-1 Formação de anticorpos e linfócitos sensibilizados por um linfonodo em resposta aos antígenos.</span> <span class=\"sn\" data-s=\"5\">Esta figura também mostra a origem dos linfócitos tímicos (7) e bursais (B) que, respectivamente, são responsáveis pelos processos imunes mediados por células e humorais. antígenos diferentes.</span> <span class=\"sn\" data-s=\"6\">Esses tipos diferentes de linfócitos T pré-processados em seguida deixam o <mark class=\"kw\" data-q=\"b5q4\">timo</mark> e se disseminam, por meio do <mark class=\"kw\" data-q=\"b5q8\">sangue</mark>, alojando-se nos tecidos linfoides localizados em todo o corpo.</span>","sents":["O Timo Processa os Linfócitos T. Os linfócitos T, após sua origem na medula óssea, migram primeiramente para o timo.","Aí eles se dividem rapidamente e ao mesmo tempo desenvolvem diversidade extrema para reagir contra diferentes antígenos específicos.","Ou seja, um linfócito tímico desenvolve reatividade específica contra um antígeno.","O linfócito seguinte desenvolve especificidade contra outro antígeno.","Esse processo continua até que existam milhares de tipos diferentes de linfócitos tímicos com reatividades específicas contra muitos milhares de Imunidade Celular Figura 34-1 Formação de anticorpos e linfócitos sensibilizados por um linfonodo em resposta aos antígenos.","Esta figura também mostra a origem dos linfócitos tímicos (7) e bursais (B) que, respectivamente, são responsáveis pelos processos imunes mediados por células e humorais. antígenos diferentes.","Esses tipos diferentes de linfócitos T pré-processados em seguida deixam o timo e se disseminam, por meio do sangue, alojando-se nos tecidos linfoides localizados em todo o corpo."],"fig":"figs/f26.jpg","qs":[{"j":"O <b>Timo</b> Processa os Linfócitos T. Os linfócitos T, após sua origem na medula óssea, migram primeiramente para o <b>timo</b>.","id":"b5q4","bloco":5,"qn":4,"q":"Para qual órgão migram os precursores dos linfócitos T após sua origem medular?","o":["Timo","Linfonodos","Fígado","Baço"],"a":0,"ans":"Timo","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"O linfócito seguinte desenvolve <b>especificidade</b> contra outro antígeno.","id":"b5q6","bloco":5,"qn":6,"q":"Qual propriedade imunológica é desenvolvida pelos linfócitos T durante sua maturação?","o":["Tolerância","Atenuação","Especificidade antigênica","Fagocitose"],"a":2,"ans":"Especificidade antigênica","s":3,"notes":[],"orphan":false,"how":"words"},{"j":"Esse processo continua até que existam milhares de tipos diferentes de linfócitos tímicos com reatividades específicas contra muitos milhares de Imunidade <b>Celular</b> Figura 34-1 Formação de anticorpos e linfócitos sensibilizados por um linfonodo em resposta aos antígenos.","id":"b5q7","bloco":5,"qn":7,"q":"Qual processo celular ocorre rapidamente com os linfócitos T durante seu pré-processamento?","o":["Fagocitose","Divisão celular","Secreção de anticorpos","Lise celular"],"a":1,"ans":"Divisão celular","s":4,"notes":[],"orphan":false,"how":"words"},{"j":"Esses tipos diferentes de linfócitos T pré-processados em seguida deixam o timo e se disseminam, por meio do <b>sangue</b>, alojando-se nos tecidos linfoides localizados em todo o corpo.","id":"b5q8","bloco":5,"qn":8,"q":"Por qual líquido corporal os linfócitos T saem do timo e alcançam os tecidos linfoides?","o":["Sangue","Bile","Líquido intersticial","Linfa"],"a":0,"ans":"Sangue","s":6,"notes":[],"orphan":false,"how":"full"}]},{"n":27,"part":1,"title":"Seleção tímica e autoantígenos","html":"<span class=\"sn\" data-s=\"0\">O <mark class=\"kw\" data-q=\"b5q10\">timo</mark> assegura também que qualquer linfócito T que deixe o <mark class=\"kw\" data-q=\"b5q10\">timo</mark> não vai reagir contra as proteínas ou com outros antígenos presentes nos tecidos do próprio corpo da pessoa; caso contrário, os linfócitos T seriam letais para seu próprio organismo em questão de dias.</span> <span class=\"sn\" data-s=\"1\">O <mark class=\"kw\" data-q=\"b5q10\">timo</mark> <mark class=\"kw\" data-q=\"b5q14\">seleciona</mark> quais linfócitos T serão liberados, misturando-os inicialmente com quase todos os “<mark class=\"kw\" data-q=\"b5q9\">autoantígenos</mark>” específicos dos tecidos corporais do indivíduo.</span> <span class=\"sn\" data-s=\"2\">Se um linfócito T reagir, ele é <mark class=\"kw\" data-q=\"b5q11\">destruído e </mark><mark class=\"kw\" data-q=\"b5q11 b5q12\">fagocitado</mark>, em vez de ser liberado.</span> <span class=\"sn\" data-s=\"3\">Isso acontece com <mark class=\"kw\" data-q=\"b5q13\">até 90%</mark> das células. Assim, as células que são por fim liberadas são as que não reagem contra os próprios antígenos do corpo — elas só reagem contra antígenos externos, como os de bactéria, de toxina ou mesmo com tecido transplantado de outra pessoa.</span>","sents":["O timo assegura também que qualquer linfócito T que deixe o timo não vai reagir contra as proteínas ou com outros antígenos presentes nos tecidos do próprio corpo da pessoa; caso contrário, os linfócitos T seriam letais para seu próprio organismo em questão de dias.","O timo seleciona quais linfócitos T serão liberados, misturando-os inicialmente com quase todos os “autoantígenos” específicos dos tecidos corporais do indivíduo.","Se um linfócito T reagir, ele é destruído e fagocitado, em vez de ser liberado.","Isso acontece com até 90% das células. Assim, as células que são por fim liberadas são as que não reagem contra os próprios antígenos do corpo — elas só reagem contra antígenos externos, como os de bactéria, de toxina ou mesmo com tecido transplantado de outra pessoa."],"fig":"figs/f27.jpg","qs":[{"j":"O timo seleciona quais linfócitos T serão liberados, misturando-os inicialmente com quase todos os “<b>autoantígenos</b>” específicos dos tecidos corporais do indivíduo.","id":"b5q9","bloco":5,"qn":9,"q":"Como são chamados os antígenos dos próprios tecidos corporais?","o":["Epítopos virais","Toxinas","Antígenos de membrana","Autoantígenos"],"a":3,"ans":"Autoantígenos","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"O <b>timo</b> assegura também que qualquer linfócito T que deixe o <b>timo</b> não vai reagir contra as proteínas ou com outros antígenos presentes nos tecidos do próprio corpo da pessoa; caso contrário, os linfócitos T seriam letais para seu próprio organismo em questão de dias.","id":"b5q10","bloco":5,"qn":10,"q":"Qual órgão impede a liberação de linfócitos T reativos aos próprios tecidos?","o":["Linfonodos","Timo","Baço","Fígado"],"a":1,"ans":"Timo","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Se um linfócito T reagir, ele é <b>destruído e fagocitado</b>, em vez de ser liberado.","id":"b5q11","bloco":5,"qn":11,"q":"Qual destino recebem os linfócitos T que reagem aos autoantígenos durante a seleção tímica?","o":["Destruição","Migração","Liberação","Multiplicação"],"a":0,"ans":"Destruição","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Se um linfócito T reagir, ele é destruído e <b>fagocitado</b>, em vez de ser liberado.","id":"b5q12","bloco":5,"qn":12,"q":"Qual processo remove as células T autorreativas depois de sua destruição no timo?","o":["Aglutinação","Neutralização","Opsonização","Fagocitose"],"a":3,"ans":"Fagocitose","s":2,"notes":[],"orphan":false,"how":"manual"},{"j":"Isso acontece com <b>até 90%</b> das células. Assim, as células que são por fim liberadas são as que não reagem contra os próprios antígenos do corpo — elas só reagem contra antígenos externos, como os de bactéria, de toxina ou mesmo com tecido transplantado de outra pessoa.","id":"b5q13","bloco":5,"qn":13,"q":"Qual porcentagem de linfócitos pode ser destruída durante a seleção tímica descrita?","o":["Até 10%","Até 1%","Até 50%","Até 90%"],"a":3,"ans":"Até 90%","s":3,"notes":[],"orphan":false,"how":"full"},{"j":"O timo assegura também que qualquer linfócito T que deixe o timo não vai reagir contra as proteínas ou com outros antígenos presentes nos tecidos do próprio corpo da pessoa; caso contrário, os linfócitos T seriam letais para seu próprio organismo em questão de dias.","id":"b5q14","bloco":5,"qn":14,"q":"Qual processo impede que linfócitos T maduros ataquem proteínas do próprio organismo?","o":["Imunização","Seleção tímica","Fagocitose","Seleção clonal"],"a":1,"ans":"Seleção tímica","s":0,"notes":[],"orphan":false,"how":"words"}]},{"n":28,"part":1,"title":"Período de processamento tímico e transplantes","html":"<span class=\"sn\" data-s=\"0\">A maior parte do pré-processamento dos linfócitos T no timo ocorre pouco antes do nascimento da criança e durante alguns meses após seu nascimento.</span> <span class=\"sn\" data-s=\"1\">Depois desse <mark class=\"kw\" data-q=\"b5q15\">período</mark>, a remoção do timo diminui (mas não elimina) o sistema imune linfocítico T.</span> <span class=\"sn\" data-s=\"2\">Entretanto, a remoção do timo meses antes do nascimento pode impedir o desenvolvimento de toda a <mark class=\"kw\" data-q=\"b5q16\">imunidade celular</mark>.</span> <span class=\"sn\" data-s=\"3\">Como esse tipo celular de imunidade é o principal responsável pela <mark class=\"kw\" data-q=\"b5q17\">rejeição</mark> de órgãos transplantados, como o coração e o rim, pode ser feito transplante de órgão com muito menor probabilidade de <mark class=\"kw\" data-q=\"b5q17\">rejeição</mark> se o <mark class=\"kw\" data-q=\"b5q18\">timo</mark> for removido do animal, em período razoável de tempo, antes de seu nascimento.</span>","sents":["A maior parte do pré-processamento dos linfócitos T no timo ocorre pouco antes do nascimento da criança e durante alguns meses após seu nascimento.","Depois desse período, a remoção do timo diminui (mas não elimina) o sistema imune linfocítico T.","Entretanto, a remoção do timo meses antes do nascimento pode impedir o desenvolvimento de toda a imunidade celular.","Como esse tipo celular de imunidade é o principal responsável pela rejeição de órgãos transplantados, como o coração e o rim, pode ser feito transplante de órgão com muito menor probabilidade de rejeição se o timo for removido do animal, em período razoável de tempo, antes de seu nascimento."],"fig":"figs/f28.jpg","qs":[{"j":"A maior parte do pré-processamento dos linfócitos T no timo ocorre pouco antes do nascimento da criança e durante alguns meses após seu nascimento.","id":"b5q15","bloco":5,"qn":15,"q":"Quando ocorre a maior parte do pré-processamento dos linfócitos T?","o":["Vida adulta","Período perinatal","Velhice","Período pós-puberal"],"a":1,"ans":"Período perinatal","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Entretanto, a remoção do timo meses antes do nascimento pode impedir o desenvolvimento de toda a <b>imunidade celular</b>.","id":"b5q16","bloco":5,"qn":16,"q":"Qual imunidade pode deixar de se desenvolver após remoção precoce do timo durante a vida fetal?","o":["Imunidade humoral","Imunidade inata","Imunidade passiva","Imunidade celular"],"a":3,"ans":"Imunidade celular","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Como esse tipo celular de imunidade é o principal responsável pela <b>rejeição</b> de órgãos transplantados, como o coração e o rim, pode ser feito transplante de órgão com muito menor probabilidade de <b>rejeição</b> se o timo for removido do animal, em período razoável de tempo, antes de seu nascimento.","id":"b5q17","bloco":5,"qn":17,"q":"Qual processo relacionado aos transplantes depende fortemente da imunidade celular?","o":["Fagocitose","Rejeição","Imunização","Aglutinação"],"a":1,"ans":"Rejeição","s":3,"notes":[],"orphan":false,"how":"full"},{"j":"Como esse tipo celular de imunidade é o principal responsável pela rejeição de órgãos transplantados, como o coração e o rim, pode ser feito transplante de órgão com muito menor probabilidade de rejeição se o <b>timo</b> for removido do animal, em período razoável de tempo, antes de seu nascimento.","id":"b5q18","bloco":5,"qn":18,"q":"Qual órgão, quando removido antes do nascimento no experimento descrito, reduz a probabilidade de rejeição de transplantes?","o":["Baço","Fígado","Timo","Medula óssea"],"a":2,"ans":"Timo","s":3,"notes":[],"orphan":false,"how":"full"}]},{"n":29,"part":1,"title":"Pré-processamento B no fígado e na medula óssea","html":"<span class=\"sn\" data-s=\"0\">O Fígado e a Medula Óssea Pré-processam os Linfócitos B.</span> <span class=\"sn\" data-s=\"1\">Muito menos se sabe sobre os detalhes do pré-processamento dos linfócitos B do que sobre o pré-processamento dos linfócitos T.</span> <span class=\"sn\" data-s=\"2\">No ser humano, sabe-se que os linfócitos B são pré-processados no fígado, durante a metade da vida fetal, e na medula óssea, ao final da vida fetal e após o nascimento.</span>","sents":["O Fígado e a Medula Óssea Pré-processam os Linfócitos B.","Muito menos se sabe sobre os detalhes do pré-processamento dos linfócitos B do que sobre o pré-processamento dos linfócitos T.","No ser humano, sabe-se que os linfócitos B são pré-processados no fígado, durante a metade da vida fetal, e na medula óssea, ao final da vida fetal e após o nascimento."],"fig":"figs/f29.jpg","qs":[]},{"n":30,"part":1,"title":"Secreção de anticorpos e diversidade dos linfócitos B","html":"<span class=\"sn\" data-s=\"0\">Os linfócitos B são diferentes dos linfócitos T por dois motivos: primeiro, em vez de todas as células desenvolverem reatividade contra o antígeno, como ocorre nos linfócitos T, os linfócitos B secretam ativamente <mark class=\"kw\" data-q=\"b6q9\">anticorpos</mark> que são os agentes reativos.</span> <span class=\"sn\" data-s=\"1\">Esses agentes são grandes moléculas proteicas, capazes de se combinar e destruir a substância antigênica, como discutido adiante em maiores detalhes e no Capítulo 33.</span> <span class=\"sn\" data-s=\"2\">Segundo, os <mark class=\"kw\" data-q=\"b6q10\">linfócitos B</mark> apresentam diversidade ainda maior do que a dos linfócitos T, consequentemente formando <mark class=\"kw\" data-q=\"b6q11\">muitos milhões</mark> de tipos de <mark class=\"kw\" data-q=\"b6q9\">anticorpos</mark> dos <mark class=\"kw\" data-q=\"b6q10\">linfócitos B</mark>, com diferentes reatividades específicas.</span>","sents":["Os linfócitos B são diferentes dos linfócitos T por dois motivos: primeiro, em vez de todas as células desenvolverem reatividade contra o antígeno, como ocorre nos linfócitos T, os linfócitos B secretam ativamente anticorpos que são os agentes reativos.","Esses agentes são grandes moléculas proteicas, capazes de se combinar e destruir a substância antigênica, como discutido adiante em maiores detalhes e no Capítulo 33.","Segundo, os linfócitos B apresentam diversidade ainda maior do que a dos linfócitos T, consequentemente formando muitos milhões de tipos de anticorpos dos linfócitos B, com diferentes reatividades específicas."],"fig":"figs/f30.jpg","qs":[{"j":"Os linfócitos B são diferentes dos linfócitos T por dois motivos: primeiro, em vez de todas as células desenvolverem reatividade contra o antígeno, como ocorre nos linfócitos T, os linfócitos B secretam ativamente <b>anticorpos</b> que são os agentes reativos.","id":"b6q9","bloco":6,"qn":9,"q":"Qual produto proteico é secretado ativamente pelos linfócitos B diferenciados?","o":["Hormônios","Anticorpos","Complemento","Autoantígenos"],"a":1,"ans":"Anticorpos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Segundo, os <b>linfócitos B</b> apresentam diversidade ainda maior do que a dos linfócitos T, consequentemente formando muitos milhões de tipos de anticorpos dos <b>linfócitos B</b>, com diferentes reatividades específicas.","id":"b6q10","bloco":6,"qn":10,"q":"Qual população linfocitária apresenta diversidade ainda maior que os linfócitos T, conforme o capítulo?","o":["Linfócitos B","Macrófagos","Neutrófilos","Linfócitos T"],"a":0,"ans":"Linfócitos B","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Segundo, os linfócitos B apresentam diversidade ainda maior do que a dos linfócitos T, consequentemente formando <b>muitos milhões</b> de tipos de anticorpos dos linfócitos B, com diferentes reatividades específicas.","id":"b6q11","bloco":6,"qn":11,"q":"Quantos tipos diferentes de anticorpos podem ser formados pelos linfócitos B?","o":["Muitos milhões","Centenas","Poucos milhares","Algumas dezenas"],"a":0,"ans":"Muitos milhões","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":31,"part":1,"title":"Alojamento dos linfócitos B","html":"<span class=\"sn\" data-s=\"0\">Depois do processamento, os linfócitos B, como os linfócitos T, migram para o <mark class=\"kw\" data-q=\"b6q12\">tecido linfoide</mark> de todo o corpo, onde se alojam próximo, mas com certo distanciamento, das áreas de linfócitos T.</span>","sents":["Depois do processamento, os linfócitos B, como os linfócitos T, migram para o tecido linfoide de todo o corpo, onde se alojam próximo, mas com certo distanciamento, das áreas de linfócitos T."],"fig":"figs/f31.jpg","qs":[{"j":"Depois do processamento, os linfócitos B, como os linfócitos T, migram para o <b>tecido linfoide</b> de todo o corpo, onde se alojam próximo, mas com certo distanciamento, das áreas de linfócitos T.","id":"b6q12","bloco":6,"qn":12,"q":"Para qual tipo de tecido migram os linfócitos B após o pré-processamento?","o":["Tecido muscular","Tecido linfoide","Tecido ósseo","Tecido nervoso"],"a":1,"ans":"Tecido linfoide","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":32,"part":1,"title":"Especificidade das respostas T e B","html":"<span class=\"sn\" data-s=\"0\">Linfócitos T e Anticorpos dos Linfócitos B Reagem de Modo Extremamente Específico Contra Antígenos Específicos — O Papel dos Clones de Linfócitos Quando antígenos específicos entram em contato com linfócitos T e B no tecido linfoide, certos linfócitos T são ativados para formar células T ativadas, e certos linfócitos B são ativados para formar anticorpos.</span> <span class=\"sn\" data-s=\"1\">As células T ativadas e os anticorpos, por sua vez, reagem de forma muito específica contra os tipos particulares de antígenos que desencadearam seu desenvolvimento.</span> <span class=\"sn\" data-s=\"2\">O mecanismo dessa especificidade é o seguinte.</span>","sents":["Linfócitos T e Anticorpos dos Linfócitos B Reagem de Modo Extremamente Específico Contra Antígenos Específicos — O Papel dos Clones de Linfócitos Quando antígenos específicos entram em contato com linfócitos T e B no tecido linfoide, certos linfócitos T são ativados para formar células T ativadas, e certos linfócitos B são ativados para formar anticorpos.","As células T ativadas e os anticorpos, por sua vez, reagem de forma muito específica contra os tipos particulares de antígenos que desencadearam seu desenvolvimento.","O mecanismo dessa especificidade é o seguinte."],"fig":"figs/f32.jpg","qs":[]},{"n":33,"part":1,"title":"Linfócitos pré-formados e especificidade individual","html":"<span class=\"sn\" data-s=\"0\"><mark class=\"kw\" data-q=\"b7q3\">Milhões</mark> de Tipos Específicos de Linfócitos São Armazenados no Tecido Linfoide.</span> <span class=\"sn\" data-s=\"1\"><mark class=\"kw\" data-q=\"b7q3\">Milhões</mark> de tipos diferentes de linfócitos B pré-formados e de linfócitos T formados, capazes de formar tipos de anticorpos ou células T muito específicos, foram armazenados no tecido linfático, como explicado antes.</span> <span class=\"sn\" data-s=\"2\">Cada um desses linfócitos pré-formados é capaz de formar <mark class=\"kw\" data-q=\"b7q4\">somente um tipo</mark> de anticorpo ou um tipo de célula T, com tipo único de especificidade.</span> <span class=\"sn\" data-s=\"3\">E somente o tipo específico de antígeno com que ele reage pode ativá-lo.</span>","sents":["Milhões de Tipos Específicos de Linfócitos São Armazenados no Tecido Linfoide.","Milhões de tipos diferentes de linfócitos B pré-formados e de linfócitos T formados, capazes de formar tipos de anticorpos ou células T muito específicos, foram armazenados no tecido linfático, como explicado antes.","Cada um desses linfócitos pré-formados é capaz de formar somente um tipo de anticorpo ou um tipo de célula T, com tipo único de especificidade.","E somente o tipo específico de antígeno com que ele reage pode ativá-lo."],"fig":"figs/f33.jpg","qs":[{"j":"<b>Milhões</b> de tipos diferentes de linfócitos B pré-formados e de linfócitos T formados, capazes de formar tipos de anticorpos ou células T muito específicos, foram armazenados no tecido linfático, como explicado antes.","id":"b7q3","bloco":7,"qn":3,"q":"Quantos tipos diferentes de linfócitos específicos estão armazenados no tecido linfoide?","o":["Centenas","Dezenas","Poucos milhares","Milhões"],"a":3,"ans":"Milhões","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Cada um desses linfócitos pré-formados é capaz de formar <b>somente um tipo</b> de anticorpo ou um tipo de célula T, com tipo único de especificidade.","id":"b7q4","bloco":7,"qn":4,"q":"Quantas especificidades principais possui cada linfócito pré-formado descrito?","o":["Uma","Duas","Milhões","Dez"],"a":0,"ans":"Uma","s":2,"notes":[],"orphan":false,"how":"manual"}]},{"n":34,"part":1,"title":"Ativação, proliferação e descendência dos linfócitos","html":"<span class=\"sn\" data-s=\"0\">Assim que o linfócito específico é ativado por seu <mark class=\"kw\" data-q=\"b7q5\">antígeno</mark> ele <mark class=\"kw\" data-q=\"b7q6\">se reproduz de forma muito ampla</mark>, formando <mark class=\"kw\" data-q=\"b7q7\">números imensos de linfócitos duplicadores</mark> (Fig.</span> <span class=\"sn\" data-s=\"1\">34-2). Se esse for linfócito B, sua progênie, eventualmente, secretará o tipo específico de <mark class=\"kw\" data-q=\"b7q8\">anticorpo</mark> que a seguir vai circular pelo corpo.</span> <span class=\"sn\" data-s=\"2\">Se for linfócito T, sua progênie é formada por <mark class=\"kw\" data-q=\"b7q9\">células</mark> T especificamente <mark class=\"kw\" data-q=\"b7q9\">sensibilizadas</mark> que são liberadas na <mark class=\"kw\" data-q=\"b7q10\">linfa</mark> e depois levadas para o sangue, circulando por todos os líquidos teciduais, retornando à <mark class=\"kw\" data-q=\"b7q10\">linfa</mark>, algumas vezes percorrendo esse circuito durante <mark class=\"kw\" data-q=\"b7q11\">meses ou anos</mark>.</span>","sents":["Assim que o linfócito específico é ativado por seu antígeno ele se reproduz de forma muito ampla, formando números imensos de linfócitos duplicadores (Fig.","34-2). Se esse for linfócito B, sua progênie, eventualmente, secretará o tipo específico de anticorpo que a seguir vai circular pelo corpo.","Se for linfócito T, sua progênie é formada por células T especificamente sensibilizadas que são liberadas na linfa e depois levadas para o sangue, circulando por todos os líquidos teciduais, retornando à linfa, algumas vezes percorrendo esse circuito durante meses ou anos."],"fig":"figs/f34.jpg","qs":[{"j":"Assim que o linfócito específico é ativado por seu <b>antígeno</b> ele se reproduz de forma muito ampla, formando números imensos de linfócitos duplicadores (Fig.","id":"b7q5","bloco":7,"qn":5,"q":"Qual substância específica desencadeia a ativação de um clone de linfócitos?","o":["Complemento","Interleucina","Antígeno","Anticorpo"],"a":2,"ans":"Antígeno","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Assim que o linfócito específico é ativado por seu antígeno ele <b>se reproduz de forma muito ampla</b>, formando números imensos de linfócitos duplicadores (Fig.","id":"b7q6","bloco":7,"qn":6,"q":"Qual processo aumenta rapidamente o número de linfócitos após o reconhecimento antigênico?","o":["Neutralização","Fagocitose","Aglutinação","Proliferação"],"a":3,"ans":"Proliferação","s":0,"notes":[],"orphan":false,"how":"manual"},{"j":"Assim que o linfócito específico é ativado por seu antígeno ele se reproduz de forma muito ampla, formando <b>números imensos de linfócitos duplicadores</b> (Fig.","id":"b7q7","bloco":7,"qn":7,"q":"Como se chama o aumento de linfócitos derivados de um clone ativado?","o":["Expansão clonal","Anergia","Fagocitose","Redução clonal"],"a":0,"ans":"Expansão clonal","s":0,"notes":[],"orphan":false,"how":"manual"},{"j":"34-2). Se esse for linfócito B, sua progênie, eventualmente, secretará o tipo específico de <b>anticorpo</b> que a seguir vai circular pelo corpo.","id":"b7q8","bloco":7,"qn":8,"q":"O que produz a descendência de um clone de linfócitos B ativado?","o":["Histamina","Anticorpos","Autoantígenos","Toxinas"],"a":1,"ans":"Anticorpos","s":1,"notes":[],"orphan":false,"how":"words"},{"j":"Se for linfócito T, sua progênie é formada por <b>células</b> T especificamente <b>sensibilizadas</b> que são liberadas na linfa e depois levadas para o sangue, circulando por todos os líquidos teciduais, retornando à linfa, algumas vezes percorrendo esse circuito durante meses ou anos.","id":"b7q9","bloco":7,"qn":9,"q":"Quais células são formadas após ativação e proliferação de clones T específicos?","o":["Plasmócitos","Células B","Macrófagos","Células T sensibilizadas"],"a":3,"ans":"Células T sensibilizadas","s":2,"notes":[],"orphan":false,"how":"words"},{"j":"Se for linfócito T, sua progênie é formada por células T especificamente sensibilizadas que são liberadas na <b>linfa</b> e depois levadas para o sangue, circulando por todos os líquidos teciduais, retornando à <b>linfa</b>, algumas vezes percorrendo esse circuito durante meses ou anos.","id":"b7q10","bloco":7,"qn":10,"q":"Qual líquido recebe inicialmente as células T sensibilizadas liberadas?","o":["Sangue","Bile","Urina","Linfa"],"a":3,"ans":"Linfa","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Se for linfócito T, sua progênie é formada por células T especificamente sensibilizadas que são liberadas na linfa e depois levadas para o sangue, circulando por todos os líquidos teciduais, retornando à linfa, algumas vezes percorrendo esse circuito durante <b>meses ou anos</b>.","id":"b7q11","bloco":7,"qn":11,"q":"Durante quanto tempo algumas células T sensibilizadas podem circular pelo organismo?","o":["Minutos","Horas ou dias","Poucas semanas","Meses ou anos"],"a":3,"ans":"Meses ou anos","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":35,"part":1,"title":"Definição de clone de linfócitos","html":"<span class=\"sn\" data-s=\"0\">Todos os diferentes linfócitos que são capazes de formar anticorpo ou célula T específicos são referidos como Célula B em desenvolvimento (medula óssea) Células B diferentes (clones) Antígeno se ligando à célula B2 específica Proliferação e diferenciação de linfócitos B2 Antígenos Secreção de anticorpos Figura 34-2 O antígeno só ativa os linfócitos que tenham receptores na superfície das células que sejam complementares e reconheçam o antígeno específico.</span> <span class=\"sn\" data-s=\"1\">Há milhões de clones distintos de linfócitos (mostrados como B1,B2 e B3).</span> <span class=\"sn\" data-s=\"2\">Quando o <mark class=\"kw\" data-q=\"b7q1 b7q2\">clone</mark><mark class=\"kw\" data-q=\"b7q1\"> de linfócitos</mark> (neste exemplo, B2) é ativado por seu antígeno, ele se reproduz, formando grande número de linfócitos duplicados que em seguida secretam anticorpos. um <mark class=\"kw\" data-q=\"b7q1 b7q2\">clone</mark><mark class=\"kw\" data-q=\"b7q1\"> de linfócitos</mark>.</span> <span class=\"sn\" data-s=\"3\">Ou seja, os linfócitos em cada clone são idênticos e derivados originariamente de um ou de alguns dos linfócitos iniciais de seu tipo específico.</span>","sents":["Todos os diferentes linfócitos que são capazes de formar anticorpo ou célula T específicos são referidos como Célula B em desenvolvimento (medula óssea) Células B diferentes (clones) Antígeno se ligando à célula B2 específica Proliferação e diferenciação de linfócitos B2 Antígenos Secreção de anticorpos Figura 34-2 O antígeno só ativa os linfócitos que tenham receptores na superfície das células que sejam complementares e reconheçam o antígeno específico.","Há milhões de clones distintos de linfócitos (mostrados como B1,B2 e B3).","Quando o clone de linfócitos (neste exemplo, B2) é ativado por seu antígeno, ele se reproduz, formando grande número de linfócitos duplicados que em seguida secretam anticorpos. um clone de linfócitos.","Ou seja, os linfócitos em cada clone são idênticos e derivados originariamente de um ou de alguns dos linfócitos iniciais de seu tipo específico."],"fig":"figs/f35.jpg","qs":[{"j":"Quando o <b>clone de linfócitos</b> (neste exemplo, B2) é ativado por seu antígeno, ele se reproduz, formando grande número de linfócitos duplicados que em seguida secretam anticorpos. um <b>clone de linfócitos</b>.","id":"b7q1","bloco":7,"qn":1,"q":"Como se chama o conjunto de linfócitos idênticos com a mesma especificidade antigênica?","o":["Tecido linfoide","Epítopo","Clone de linfócitos","Autoantígeno"],"a":2,"ans":"Clone de linfócitos","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Quando o <b>clone</b> de linfócitos (neste exemplo, B2) é ativado por seu antígeno, ele se reproduz, formando grande número de linfócitos duplicados que em seguida secretam anticorpos. um <b>clone</b> de linfócitos.","id":"b7q2","bloco":7,"qn":2,"q":"Qual nome recebe uma população de linfócitos derivada de células precursoras específicas?","o":["Tecido linfoide","Epítopo","Clone","Complemento"],"a":2,"ans":"Clone","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":36,"part":1,"title":"Origem genética da diversidade dos clones","html":"<span class=\"sn\" data-s=\"0\">Origem dos Diversos Clones de Linfócitos Somente <mark class=\"kw\" data-q=\"b7q14\">centenas</mark> a alguns <mark class=\"kw\" data-q=\"b7q14\">milhares</mark> de genes codificam os milhões de tipos diferentes de anticorpos e de linfócitos T.</span> <span class=\"sn\" data-s=\"1\">De início, era um mistério como seria possível que tão poucos genes codificassem os milhões de especificidades diferentes das moléculas de anticorpos ou das células T que poderiam ser produzidas pelo tecido linfoide, especialmente quando se considera que um só gene é em geral necessário para a formação de cada tipo diferente de proteína.</span> <span class=\"sn\" data-s=\"2\">Esse mistério já foi desvendado. Para a formação de cada tipo de célula T ou B, o gene completo nunca está presente nas células-tronco originais de onde as células imunes funcionais se diferenciam.</span> <span class=\"sn\" data-s=\"3\">Ao contrário, só são identificados e “segmentos do gene” — na verdade, centenas de tais segmentos — mas não o gene completo.</span> <span class=\"sn\" data-s=\"4\">Durante o pré-processamento das respectivas células de linfócitos T e B esses segmentos do gene se misturam em <mark class=\"kw\" data-q=\"b7q13\">combinações aleatórias</mark>, formando assim, por fim, os genes completos.</span> <span class=\"sn\" data-s=\"5\">Como existem várias centenas de segmentos de genes, bem como milhões de diferentes combinações, nas quais esses segmentos podem ser dispostos nas células, podem-se compreender os milhões de células com tipos celulares diferentes que podem ocorrer.</span> <span class=\"sn\" data-s=\"6\">Para cada linfócito T ou B funcional que por fim é formado, a estrutura <mark class=\"kw\" data-q=\"b7q12\">gênica</mark> só codifica apenas a <mark class=\"kw\" data-q=\"b7q15\">especificidade antigênica</mark>.</span> <span class=\"sn\" data-s=\"7\">Essas células, quando maduras, se tornam células T e B extremamente específicas que se disseminam e povoam o tecido linfoide.</span>","sents":["Origem dos Diversos Clones de Linfócitos Somente centenas a alguns milhares de genes codificam os milhões de tipos diferentes de anticorpos e de linfócitos T.","De início, era um mistério como seria possível que tão poucos genes codificassem os milhões de especificidades diferentes das moléculas de anticorpos ou das células T que poderiam ser produzidas pelo tecido linfoide, especialmente quando se considera que um só gene é em geral necessário para a formação de cada tipo diferente de proteína.","Esse mistério já foi desvendado. Para a formação de cada tipo de célula T ou B, o gene completo nunca está presente nas células-tronco originais de onde as células imunes funcionais se diferenciam.","Ao contrário, só são identificados e “segmentos do gene” — na verdade, centenas de tais segmentos — mas não o gene completo.","Durante o pré-processamento das respectivas células de linfócitos T e B esses segmentos do gene se misturam em combinações aleatórias, formando assim, por fim, os genes completos.","Como existem várias centenas de segmentos de genes, bem como milhões de diferentes combinações, nas quais esses segmentos podem ser dispostos nas células, podem-se compreender os milhões de células com tipos celulares diferentes que podem ocorrer.","Para cada linfócito T ou B funcional que por fim é formado, a estrutura gênica só codifica apenas a especificidade antigênica.","Essas células, quando maduras, se tornam células T e B extremamente específicas que se disseminam e povoam o tecido linfoide."],"fig":null,"qs":[{"j":"Para cada linfócito T ou B funcional que por fim é formado, a estrutura <b>gênica</b> só codifica apenas a especificidade antigênica.","id":"b7q12","bloco":7,"qn":12,"q":"Como se chamam as unidades genéticas que se recombinam para formar especificidades diferentes?","o":["Cromossomos","Epítopos","Plasmídeos","Segmentos gênicos"],"a":3,"ans":"Segmentos gênicos","s":6,"notes":[],"orphan":false,"how":"words"},{"j":"Durante o pré-processamento das respectivas células de linfócitos T e B esses segmentos do gene se misturam em <b>combinações aleatórias</b>, formando assim, por fim, os genes completos.","id":"b7q13","bloco":7,"qn":13,"q":"Qual mecanismo gera milhões de combinações gênicas durante o pré-processamento dos linfócitos?","o":["Combinações aleatórias","Lise","Fagocitose","Seleção tímica"],"a":0,"ans":"Combinações aleatórias","s":4,"notes":[],"orphan":false,"how":"full"},{"j":"Origem dos Diversos Clones de Linfócitos Somente <b>centenas</b> a alguns <b>milhares</b> de genes codificam os milhões de tipos diferentes de anticorpos e de linfócitos T.","id":"b7q14","bloco":7,"qn":14,"q":"Quantos genes aproximadamente estão envolvidos na codificação dos milhões de especificidades descritas?","o":["Centenas a milhares","Dezenas","Bilhões","Milhões"],"a":0,"ans":"Centenas a milhares","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Para cada linfócito T ou B funcional que por fim é formado, a estrutura gênica só codifica apenas a <b>especificidade antigênica</b>.","id":"b7q15","bloco":7,"qn":15,"q":"Qual característica dos linfócitos maduros é determinada pela estrutura gênica formada?","o":["Especificidade antigênica","Velocidade de migração","Tamanho celular","Peso molecular"],"a":0,"ans":"Especificidade antigênica","s":6,"notes":[],"orphan":false,"how":"full"}]},{"n":37,"part":1,"title":"Anticorpos de membrana dos linfócitos B","html":"<span class=\"sn\" data-s=\"0\">Mecanismo para a Ativação do Clone de Linfócitos Cada clone de linfócitos é responsável por somente tipo único de antígeno (ou por vários antígenos semelhantes, com quase as mesmas características estereoquímicas).</span> <span class=\"sn\" data-s=\"1\">O motivo para que isso ocorra é o seguinte: no caso dos linfócitos B, cada um deles tem, na superfície de sua <mark class=\"kw\" data-q=\"b7q17 b7q18\">membrana</mark><mark class=\"kw\" data-q=\"b7q17\"> celular</mark>, aproximadamente <mark class=\"kw\" data-q=\"b7q16\">100.000 moléculas</mark> de <mark class=\"kw\" data-q=\"b7q18\">anticorpos</mark> que devem reagir de forma específica com somente um tipo específico de antígeno.</span> <span class=\"sn\" data-s=\"2\">Portanto, quando o antígeno apropriado aparece, ele se liga imediatamente ao anticorpo na <mark class=\"kw\" data-q=\"b7q17\">membrana celular</mark>; isto causa o processo de ativação que descreveremos em maiores detalhes adiante.</span>","sents":["Mecanismo para a Ativação do Clone de Linfócitos Cada clone de linfócitos é responsável por somente tipo único de antígeno (ou por vários antígenos semelhantes, com quase as mesmas características estereoquímicas).","O motivo para que isso ocorra é o seguinte: no caso dos linfócitos B, cada um deles tem, na superfície de sua membrana celular, aproximadamente 100.000 moléculas de anticorpos que devem reagir de forma específica com somente um tipo específico de antígeno.","Portanto, quando o antígeno apropriado aparece, ele se liga imediatamente ao anticorpo na membrana celular; isto causa o processo de ativação que descreveremos em maiores detalhes adiante."],"fig":null,"qs":[{"j":"O motivo para que isso ocorra é o seguinte: no caso dos linfócitos B, cada um deles tem, na superfície de sua membrana celular, aproximadamente <b>100.000 moléculas</b> de anticorpos que devem reagir de forma específica com somente um tipo específico de antígeno.","id":"b7q16","bloco":7,"qn":16,"q":"Quantas moléculas de anticorpos existem aproximadamente na superfície de um linfócito B?","o":["100.000 moléculas","1.000 moléculas","100 moléculas","10 milhões de moléculas"],"a":0,"ans":"100.000 moléculas","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"O motivo para que isso ocorra é o seguinte: no caso dos linfócitos B, cada um deles tem, na superfície de sua <b>membrana celular</b>, aproximadamente 100.000 moléculas de anticorpos que devem reagir de forma específica com somente um tipo específico de antígeno.","id":"b7q17","bloco":7,"qn":17,"q":"Onde estão localizados os anticorpos que reconhecem antígenos nos linfócitos B?","o":["Membrana celular","Retículo endoplasmático","Núcleo","Citoplasma"],"a":0,"ans":"Membrana celular","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"O motivo para que isso ocorra é o seguinte: no caso dos linfócitos B, cada um deles tem, na superfície de sua <b>membrana</b> celular, aproximadamente 100.000 moléculas de <b>anticorpos</b> que devem reagir de forma específica com somente um tipo específico de antígeno.","id":"b7q18","bloco":7,"qn":18,"q":"Qual estrutura reconhece especificamente os antígenos na superfície dos linfócitos B?","o":["Complemento","Anticorpos de membrana","Interleucinas","Histamina"],"a":1,"ans":"Anticorpos de membrana","s":1,"notes":[],"orphan":false,"how":"words"}]},{"n":38,"part":1,"title":"Receptores T e complementaridade antigênica","html":"<span class=\"sn\" data-s=\"0\">No caso dos linfócitos T, moléculas similares aos anticorpos, chamadas proteínas <mark class=\"kw\" data-q=\"b7q19\">receptoras</mark> de <mark class=\"kw\" data-q=\"b7q19\">superfície</mark> (ou marcadores de células T), estão localizadas na superfície da membrana da célula T, e elas também são muito específicas para um antígeno ativador especificado.</span> <span class=\"sn\" data-s=\"1\">Assim, um antígeno só <mark class=\"kw\" data-q=\"b7q21\">estimula as células que têm </mark><mark class=\"kw\" data-q=\"b7q20 b7q21\">receptores complementares</mark> para o antígeno e já estão comprometidas a responder a ele.</span>","sents":["No caso dos linfócitos T, moléculas similares aos anticorpos, chamadas proteínas receptoras de superfície (ou marcadores de células T), estão localizadas na superfície da membrana da célula T, e elas também são muito específicas para um antígeno ativador especificado.","Assim, um antígeno só estimula as células que têm receptores complementares para o antígeno e já estão comprometidas a responder a ele."],"fig":null,"qs":[{"j":"No caso dos linfócitos T, moléculas similares aos anticorpos, chamadas proteínas <b>receptoras</b> de <b>superfície</b> (ou marcadores de células T), estão localizadas na superfície da membrana da célula T, e elas também são muito específicas para um antígeno ativador especificado.","id":"b7q19","bloco":7,"qn":19,"q":"Quais estruturas reconhecem antígenos específicos na superfície dos linfócitos T?","o":["Epítopos","Interleucinas","Receptores de superfície","Anticorpos livres"],"a":2,"ans":"Receptores de superfície","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Assim, um antígeno só estimula as células que têm <b>receptores complementares</b> para o antígeno e já estão comprometidas a responder a ele.","id":"b7q20","bloco":7,"qn":20,"q":"Qual propriedade dos receptores permite que o antígeno ative um linfócito específico?","o":["Peso molecular","Solubilidade","Mobilidade","Complementaridade"],"a":3,"ans":"Complementaridade","s":1,"notes":[],"orphan":false,"how":"manual"},{"j":"Assim, um antígeno só <b>estimula as células que têm receptores complementares</b> para o antígeno e já estão comprometidas a responder a ele.","id":"b7q21","bloco":7,"qn":21,"q":"Qual processo é desencadeado pela ligação do antígeno ao receptor específico?","o":["Lise celular","Tolerância","Fagocitose","Ativação linfocitária"],"a":3,"ans":"Ativação linfocitária","s":1,"notes":[{"k":"ref","t":"Trecho 37, sobre a ativação dos linfócitos B pela ligação ao anticorpo de membrana.","n":[37]}],"orphan":false,"how":"manual"}]},{"n":39,"part":1,"title":"Fagocitose e apresentação pelos macrófagos","html":"<span class=\"sn\" data-s=\"0\">Papel dos Macrófagos no Processo de Ativação.</span> <span class=\"sn\" data-s=\"1\">Além dos linfócitos nos tecidos linfoides, literalmente milhões de macrófagos também estão presentes nos mesmos tecidos.</span> <span class=\"sn\" data-s=\"2\">Essas células revestem os sinusoides dos linfonodos, do baço e dos outros tecidos linfoides, ficando em aposição a muitos linfócitos dos linfonodos.</span> <span class=\"sn\" data-s=\"3\">A maioria dos microrganismos invasores é <mark class=\"kw\" data-q=\"b8q2\">fagocitada primeiro</mark>, e parcialmente digerida pelos <mark class=\"kw\" data-q=\"b8q1\">macrófagos</mark>, e os produtos <mark class=\"kw\" data-q=\"b8q7\">antigênicos</mark> são liberados no <mark class=\"kw\" data-q=\"b8q3\">citosol</mark> do macrófago.</span> <span class=\"sn\" data-s=\"4\">Os macrófagos a seguir passam esses antígenos pelo <mark class=\"kw\" data-q=\"b8q4\">contato direto</mark> célula a célula para os linfócitos, causando ativação dos clones linfocíticos especificados.</span>","sents":["Papel dos Macrófagos no Processo de Ativação.","Além dos linfócitos nos tecidos linfoides, literalmente milhões de macrófagos também estão presentes nos mesmos tecidos.","Essas células revestem os sinusoides dos linfonodos, do baço e dos outros tecidos linfoides, ficando em aposição a muitos linfócitos dos linfonodos.","A maioria dos microrganismos invasores é fagocitada primeiro, e parcialmente digerida pelos macrófagos, e os produtos antigênicos são liberados no citosol do macrófago.","Os macrófagos a seguir passam esses antígenos pelo contato direto célula a célula para os linfócitos, causando ativação dos clones linfocíticos especificados."],"fig":null,"qs":[{"j":"A maioria dos microrganismos invasores é fagocitada primeiro, e parcialmente digerida pelos <b>macrófagos</b>, e os produtos antigênicos são liberados no citosol do macrófago.","id":"b8q1","bloco":8,"qn":1,"q":"Quais células fagocitam microrganismos antes de apresentar seus antígenos aos linfócitos?","o":["Hemácias","Linfócitos B","Plasmócitos","Macrófagos"],"a":3,"ans":"Macrófagos","s":3,"notes":[],"orphan":false,"how":"full"},{"j":"A maioria dos microrganismos invasores é <b>fagocitada primeiro</b>, e parcialmente digerida pelos macrófagos, e os produtos antigênicos são liberados no citosol do macrófago.","id":"b8q2","bloco":8,"qn":2,"q":"Qual processo permite aos macrófagos englobar microrganismos invasores?","o":["Pinocitose","Fagocitose","Aglutinação","Opsonização"],"a":1,"ans":"Fagocitose","s":3,"notes":[],"orphan":false,"how":"manual"},{"j":"A maioria dos microrganismos invasores é fagocitada primeiro, e parcialmente digerida pelos macrófagos, e os produtos antigênicos são liberados no <b>citosol</b> do macrófago.","id":"b8q3","bloco":8,"qn":3,"q":"Qual organela celular, mencionada como local de liberação dos produtos antigênicos, recebe esses produtos após a digestão parcial?","o":["Mitocôndria","Lisossomo","Citosol","Núcleo"],"a":2,"ans":"Citosol","s":3,"notes":[{"k":"rev","t":"Bloco 8, Questão 3 — o capítulo identifica o citosol como local de liberação, mas não o classifica como organela celular.","n":[]}],"orphan":false,"how":"full"},{"j":"Os macrófagos a seguir passam esses antígenos pelo <b>contato direto</b> célula a célula para os linfócitos, causando ativação dos clones linfocíticos especificados.","id":"b8q4","bloco":8,"qn":4,"q":"Como os macrófagos transferem os antígenos aos linfócitos no mecanismo descrito?","o":["Contato direto","Via sanguínea","Secreção de anticorpos","Ativação do complemento"],"a":0,"ans":"Contato direto","s":4,"notes":[],"orphan":false,"how":"full"},{"j":"A maioria dos microrganismos invasores é fagocitada primeiro, e parcialmente digerida pelos macrófagos, e os produtos <b>antigênicos</b> são liberados no citosol do macrófago.","id":"b8q7","bloco":8,"qn":7,"q":"Qual é a função imunológica dos macrófagos após o processamento dos antígenos?","o":["Apresentação antigênica","Secreção de histamina","Produção de anticorpos","Síntese de complemento"],"a":0,"ans":"Apresentação antigênica","s":3,"notes":[],"orphan":false,"how":"words"}]},{"n":40,"part":1,"title":"Interleucina-1 dos macrófagos","html":"<span class=\"sn\" data-s=\"0\">Os <mark class=\"kw\" data-q=\"b8q6\">macrófagos</mark>, além disso, secretam substância ativadora especial que promove crescimento ainda maior e a reprodução de leucócitos específicos.</span> <span class=\"sn\" data-s=\"1\">Essa substância é chamada <mark class=\"kw\" data-q=\"b8q5\">interleucina-1</mark>.</span>","sents":["Os macrófagos, além disso, secretam substância ativadora especial que promove crescimento ainda maior e a reprodução de leucócitos específicos.","Essa substância é chamada interleucina-1."],"fig":null,"qs":[{"j":"Os macrófagos, além disso, secretam substância ativadora especial que promove crescimento ainda maior e a reprodução de leucócitos específicos.","id":"b8q5","bloco":8,"qn":5,"q":"Qual interleucina secretada pelos macrófagos estimula o crescimento e a reprodução de leucócitos?","o":["Histamina","Interleucina-2","Interleucina-1","Interferon"],"a":2,"ans":"Interleucina-1","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os <b>macrófagos</b>, além disso, secretam substância ativadora especial que promove crescimento ainda maior e a reprodução de leucócitos específicos.","id":"b8q6","bloco":8,"qn":6,"q":"Quais células secretam interleucina-1 durante a ativação imunológica descrita?","o":["Plasmócitos","Macrófagos","Linfócitos B","Hemácias"],"a":1,"ans":"Macrófagos","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":41,"part":1,"title":"Cooperação das células T auxiliares com os linfócitos B","html":"<span class=\"sn\" data-s=\"0\">Participação das Células T na Ativação dos <mark class=\"kw\" data-q=\"b8q12\">Linfócitos</mark> B.</span> <span class=\"sn\" data-s=\"1\">A maioria dos antígenos ativa, ao mesmo tempo, os linfócitos T e os linfócitos B.</span> <span class=\"sn\" data-s=\"2\">Algumas das células T que são formadas, chamadas células auxiliares, secretam substâncias específicas (coletivamente, chamadas de <mark class=\"kw\" data-q=\"b8q9 b8q10\">linfocinas</mark>) que ativam os linfócitos B específicos.</span> <span class=\"sn\" data-s=\"3\">Na verdade, sem o auxílio dessas <mark class=\"kw\" data-q=\"b8q8\">células T auxiliares</mark>, a quantidade de <mark class=\"kw\" data-q=\"b8q11\">anticorpos</mark> formada pelos linfócitos B seria usualmente pequena.</span> <span class=\"sn\" data-s=\"4\">Voltaremos a discutir essa relação cooperativa entre as <mark class=\"kw\" data-q=\"b8q8\">células T auxiliares</mark> e as células B quando tivermos a oportunidade de descrever o sistema de imunidade das células T.</span>","sents":["Participação das Células T na Ativação dos Linfócitos B.","A maioria dos antígenos ativa, ao mesmo tempo, os linfócitos T e os linfócitos B.","Algumas das células T que são formadas, chamadas células auxiliares, secretam substâncias específicas (coletivamente, chamadas de linfocinas) que ativam os linfócitos B específicos.","Na verdade, sem o auxílio dessas células T auxiliares, a quantidade de anticorpos formada pelos linfócitos B seria usualmente pequena.","Voltaremos a discutir essa relação cooperativa entre as células T auxiliares e as células B quando tivermos a oportunidade de descrever o sistema de imunidade das células T."],"fig":null,"qs":[{"j":"Na verdade, sem o auxílio dessas <b>células T auxiliares</b>, a quantidade de anticorpos formada pelos linfócitos B seria usualmente pequena.","id":"b8q8","bloco":8,"qn":8,"q":"Quais células T participam diretamente da ativação dos linfócitos B?","o":["Neutrófilos","Células T citotóxicas","Células T supressoras","Células T auxiliares"],"a":3,"ans":"Células T auxiliares","s":3,"notes":[],"orphan":false,"how":"full"},{"j":"Algumas das células T que são formadas, chamadas células auxiliares, secretam substâncias específicas (coletivamente, chamadas de <b>linfocinas</b>) que ativam os linfócitos B específicos.","id":"b8q9","bloco":8,"qn":9,"q":"Como são chamadas coletivamente as substâncias secretadas pelas células T auxiliares?","o":["Antígenos","Imunoglobulinas","Perforinas","Linfocinas"],"a":3,"ans":"Linfocinas","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Algumas das células T que são formadas, chamadas células auxiliares, secretam substâncias específicas (coletivamente, chamadas de <b>linfocinas</b>) que ativam os linfócitos B específicos.","id":"b8q10","bloco":8,"qn":10,"q":"Quais substâncias secretadas pelas células T auxiliares estimulam linfóc que ocorram exaustão e morte do plasmócito."],"fig":null,"qs":[{"j":"A seguir, o <b>plasmócito</b> maduro passa a produzir anticorpos de gamaglobulina, em velocidade extremamente rápida — cerca de 2.000 moléculas por segundo, para cada <b>plasmócito</b>.","id":"b9q12","bloco":9,"qn":12,"q":"Qual célula é especializada na produção intensa de anticorpos?","o":["Plasmócito","Macrófago","Neutrófilo","Linfócito T"],"a":0,"ans":"Plasmócito","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"A seguir, o plasmócito maduro passa a produzir anticorpos de gamaglobulina, em velocidade extremamente rápida — cerca de <b>2.000 moléculas</b> por segundo, para cada plasmócito.","id":"b9q13","bloco":9,"qn":13,"q":"Quantas moléculas de anticorpos um plasmócito maduro pode produzir por segundo?","o":["20 moléculas","200 moléculas","2.000 moléculas","2 milhões de moléculas"],"a":2,"ans":"2.000 moléculas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"A seguir, o plasmócito maduro passa a produzir anticorpos de <b>gamaglobulina</b>, em velocidade extremamente rápida — cerca de 2.000 moléculas por segundo, para cada plasmócito.","id":"b9q14","bloco":9,"qn":14,"q":"Qual classe de proteínas é produzida pelos plasmócitos maduros?","o":["Hormônios","Lipoproteínas","Albuminas","Gamaglobulinas"],"a":3,"ans":"Gamaglobulinas","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Por sua vez, esses anticorpos são secretados para a <b>linfa</b> e levados para o sangue circulante.","id":"b9q15","bloco":9,"qn":15,"q":"Para qual líquido são inicialmente secretados os anticorpos produzidos pelos plasmócitos?","o":["Líquor","Linfa","Urina","Bile"],"a":1,"ans":"Linfa","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Esse processo continua durante dias ou semanas, até que ocorram exaustão e <b>morte</b> do plasmócito.","id":"b9q16","bloco":9,"qn":16,"q":"Qual destino celular encerra a produção de anticorpos após dias ou semanas de atividade plasmocitária?","o":["Mutação","Fagocitose","Divisão celular","Morte celular"],"a":3,"ans":"Morte celular","s":2,"notes":[],"orphan":false,"how":"words"}]},{"n":46,"part":1,"title":"Formação e distribuição das células B de memória","html":"<span class=\"sn\" data-s=\"0\">Formação das Células de “Memória&quot;— Diferença Entre as Respostas Primária e Secundária.</span> <span class=\"sn\" data-s=\"1\">Alguns dos linfócitos formados pela ativação de clone de linfócitos B não se diferenciam em plasmócitos, mas formam na verdade número moderado de novos linfócitos B semelhantes aos do clone original.</span> <span class=\"sn\" data-s=\"2\">Em outras palavras, a população de células B que especificamente ativou o clone aumenta e os novos linfócitos B se juntam aos linfócitos originais do mesmo clone.</span> <span class=\"sn\" data-s=\"3\">Eles circulam por todo o corpo, para popular todo o <mark class=\"kw\" data-q=\"b10q4\">tecido linfoide</mark>; entretanto, em termos imunológicos, eles permanecem inativados até que sejam novamente acionados por nova exposição ao mesmo antígeno.</span> <span class=\"sn\" data-s=\"4\">Esses linfócitos são referidos como <mark class=\"kw\" data-q=\"b10q1 b10q2 b10q3\">células de memória</mark>.</span> <span class=\"sn\" data-s=\"5\">A exposição subsequente ao mesmo antígeno vai provocar resposta mais rápida e mais intensa de anticorpos, já que existem muito mais <mark class=\"kw\" data-q=\"b10q1 b10q2 b10q3\">células de memória</mark> do que os linfócitos B originais do clone específico.</span>","sents":["Formação das Células de “Memória&quot;— Diferença Entre as Respostas Primária e Secundária.","Alguns dos linfócitos formados pela ativação de clone de linfócitos B não se diferenciam em plasmócitos, mas formam na verdade número moderado de novos linfócitos B semelhantes aos do clone original.","Em outras palavras, a população de células B que especificamente ativou o clone aumenta e os novos linfócitos B se juntam aos linfócitos originais do mesmo clone.","Eles circulam por todo o corpo, para p ","Precipitação","Neutralização","Aglutinação"],"a":2,"ans":"Neutralização","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"3. <b>Neutralização</b>, na qual os anticorpos cobrem os locais tóxicos do agente antigênico.","id":"b12q9","bloco":12,"qn":9,"q":"Como se chama o bloqueio da atividade tóxica de um antígeno pelos anticorpos?","o":["Neutralização","Aglutinação","Precipitação","Lise"],"a":0,"ans":"Neutralização","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":68,"part":2,"title":"Lise por anticorpos","html":"<span class=\"sn\" data-s=\"0\">4. <mark class=\"kw\" data-q=\"b12q10 b12q11\">Lise</mark>, na qual anticorpos potentes ocasionalmente são capazes de atacar de modo direto as membranas dos agentes celulares, causando sua ruptura.</span>","sents":["4. Lise, na qual anticorpos potentes ocasionalmente são capazes de atacar de modo direto as membranas dos agentes celulares, causando sua ruptura."],"fig":null,"qs":[{"j":"4. <b>Lise</b>, na qual anticorpos potentes ocasionalmente são capazes de atacar de modo direto as membranas dos agentes celulares, causando sua ruptura.","id":"b12q10","bloco":12,"qn":10,"q":"Qual processo envolve ruptura da membrana do agente celular por ação de anticorpos?","o":["Precipitação","Lise","Aglutinação","Neutralização"],"a":1,"ans":"Lise","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"4. <b>Lise</b>, na qual anticorpos potentes ocasionalmente são capazes de atacar de modo direto as membranas dos agentes celulares, causando sua ruptura.","id":"b12q11","bloco":12,"qn":11,"q":"Como se chama a destruição celular provocada pela ruptura da membrana?","o":["Neutralização","Aglutinação","Lise","Precipitação"],"a":2,"ans":"Lise","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":69,"part":2,"title":"Importância dos efeitos amplificadores do complemento","html":"<span class=\"sn\" data-s=\"0\">Essas ações diretas dos anticorpos, atacando os invasores antigênicos, não são suficientemente fortes para ter papel primordial na proteção do corpo contra o invasor.</span> <span class=\"sn\" data-s=\"1\">A maior parte dessa proteção decorre dos efeitos amplificadores do sistema do <mark class=\"kw\" data-q=\"b12q12 b12q13\">complemento</mark>, descrito a seguir.</span>","sents":["Essas ações diretas dos anticorpos, atacando os invasores antigênicos, não são suficientemente fortes para ter papel primordial na proteção do corpo contra o invasor.","A maior parte dessa proteção decorre dos efeitos amplificadores do sistema do complemento, descrito a seguir."],"fig":null,"qs":[{"j":"A maior parte dessa proteção decorre dos efeitos amplificadores do sistema do <b>complemento</b>, descrito a seguir.","id":"b12q12","bloco":12,"qn":12,"q":"Qual sistema apresenta os efeitos amplificadores responsáveis pela maior parte da proteção descrita?","o":["Linfonodos","Interleucinas","Reaginas","Complemento"],"a":3,"ans":"Complemento","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Essas ações diretas dos anticorpos, atacando os invasores antigênicos, não são suficientemente fortes para ter papel primordial na proteção do corpo contra o invasor.","id":"b12q13","bloco":12,"qn":13,"q":"Qual mecanismo complementa e intensifica a ação direta dos anticorpos contra invasores?","o":["Fagocitose isolada","Ativação do complemento","Seleção tímica","Produção de histamina"],"a":1,"ans":"Ativação do complemento","s":0,"notes":[{"k":"ref","t":"Trecho 63, sobre a ativação do sistema do complemento pelos anticorpos.","n":[63]}],"orphan":false,"how":"words"}]},{"n":70,"part":2,"title":"Composição e estado inativo do complemento","html":"<span class=\"sn\" data-s=\"0\">Sistema do <mark class=\"kw\" data-q=\"b13q1\">Complemento</mark> para a Ação de Anticorpos “<mark class=\"kw\" data-q=\"b13q1\">Complemento</mark>” é o nome coletivo que descreve o sistema de cerca de <mark class=\"kw\" data-q=\"b13q2\">20 proteínas</mark>, muitas das quais precursoras de enzimas.</span> <span class=\"sn\" data-s=\"1\">Os principais atores desse sistema são <mark class=\"kw\" data-q=\"b13q3\">11 proteínas</mark> designadas de C1 a C9, <mark class=\"kw\" data-q=\"b13q4\">B e D</mark>, como mostrado na Figura 34-6.</span> <span class=\"sn\" data-s=\"2\">Todas essas proteínas estão normalmente presentes nas proteínas plasmáticas, além de entre as proteínas que vazam dos capilares para os espaços teciduais.</span> <span class=\"sn\" data-s=\"3\">As precursoras de enzimas nas condições normais estão <mark class=\"kw\" data-q=\"b13q5\">inativas</mark> mas podem ser ativadas, principalmente pela chamada via clássica.</span>","sents":["Sistema do Complemento para a Ação de Anticorpos “Complemento” é o nome coletivo que descreve o sistema de cerca de 20 proteínas, muitas das quais precursoras de enzimas.","Os principais atores desse sistema são 11 proteínas designadas de C1 a C9, B e D, como mostrado na Figura 34-6.","Todas essas proteínas estão normalmente presentes nas proteínas plasmáticas, além de entre as proteínas que vazam dos capilares para os espaços teciduais.","As precursoras de enzimas nas condições normais estão inativas mas podem ser ativadas, principalmente pela chamada via clássica."],"fig":null,"qs":[{"j":"Sistema do <b>Complemento</b> para a Ação de Anticorpos “<b>Complemento</b>” é o nome coletivo que descreve o sistema de cerca de 20 proteínas, muitas das quais precursoras de enzimas.","id":"b13q1","bloco":13,"qn":1,"q":"Como se chama o conjunto de proteínas plasmáticas que potencializa a ação dos anticorpos?","o":["Interleucinas","Complemento","Imunoglobulinas","Linfocinas"],"a":1,"ans":"Complemento","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Sistema do Complemento para a Ação de Anticorpos “Complemento” é o nome coletivo que descreve o sistema de cerca de <b>20 proteínas</b>, muitas das quais precursoras de enzimas.","id":"b13q2","bloco":13,"qn":2,"q":"Quantas proteínas aproximadamente constituem o sistema do complemento?","o":["200 proteínas","2 proteínas","20 proteínas","2.000 proteínas"],"a":2,"ans":"20 proteínas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os principais atores desse sistema são <b>11 proteínas</b> designadas de C1 a C9, B e D, como mostrado na Figura 34-6.","id":"b13q3","bloco":13,"qn":3,"q":"Quantas proteínas são destacadas como principais componentes do complemento?","o":["Cinco","Onze","Cem","Vinte"],"a":1,"ans":"Onze","s":1,"notes":[],"orphan":false,"how":"manual"},{"j":"Os principais atores desse sistema são 11 proteínas designadas de C1 a C9, <b>B e D</b>, como mostrado na Figura 34-6.","id":"b13q4","bloco":13,"qn":4,"q":"Quais são os dois componentes do complemento identificados por letras sem números?","o":["B e D","X e Y","A e C","E e F"],"a":0,"ans":"B e D","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"As precursoras de enzimas nas condições normais estão <b>inativas</b> mas podem ser ativadas, principalmente pela chamada via clássica.","id":"b13q5","bloco":13,"qn":5,"q":"Como se encontram normalmente as proenzimas do complemento antes da ativação?","o":["Desnaturadas","Em excesso","Inativas","Ativas"],"a":2,"ans":"Inativas","s":3,"notes":[],"orphan":false,"how":"full"}]},{"n":71,"part":2,"title":"Início da via clássica","html":"<span class=\"sn\" data-s=\"0\"><mark class=\"kw\" data-q=\"b13q7\">Complexo antígeno-anticorpo</mark> <mark class=\"kw\" data-q=\"b13q6\">Via Clássica</mark>.</span> <span class=\"sn\" data-s=\"1\">A <mark class=\"kw\" data-q=\"b13q6\">via clássica</mark> é desencadeada por uma reação antígeno-anticorpo.</span> <span class=\"sn\" data-s=\"2\">Ou seja, quando o anticorpo se liga a seu antígeno, um local reativo específico na <mark class=\"kw\" data-q=\"b13q9\">porção</mark> “<mark class=\"kw\" data-q=\"b13q9\">constante</mark>” do anticorpo fica descoberto ou “ativado” e essa porção por sua vez se liga diretamente à molécula <mark class=\"kw\" data-q=\"b13q8\">C1</mark> do sistema do complemento, iniciando uma “<mark class=\"kw\" data-q=\"b13q10\">cascata</mark>” de reações sequenciais, como mostrado na Figura 34-6, começando pela ativação da própria proenzima <mark class=\"kw\" data-q=\"b13q8\">C1</mark>.</span>","sents":["Complexo antígeno-anticorpo Via Clássica.","A via clássica é desencadeada por uma reação antígeno-anticorpo.","Ou seja, quando o anticorpo se liga a seu antígeno, um local reativo específico na porção “constante” do anticorpo fica descoberto ou “ativado” e essa porção por sua vez se liga diretamente à molécula C1 do sistema do complemento, iniciando uma “cascata” de reações sequenciais, como mostrado na Figura 34-6, começando pela ativação da própria proenzima C1."],"fig":null,"qs":[{"j":"A <b>via clássica</b> é desencadeada por uma reação antígeno-anticorpo.","id":"b13q6","bloco":13,"qn":6,"q":"Qual via do complemento é desencadeada por uma reação antígeno-anticorpo?","o":["Via das lectinas","Via intrínseca","Via alternativa","Via clássica"],"a":3,"ans":"Via clássica","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"<b>Complexo antígeno-anticorpo</b> Via Clássica.","id":"b13q7","bloco":13,"qn":7,"q":"Qual interação imunológica inicia a via clássica do complemento?","o":["Complexo antígeno-anticorpo","Ação de interleucinas","Ligação de histamina","Fagocitose direta"],"a":0,"ans":"Complexo antígeno-anticorpo","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Ou seja, quando o anticorpo se liga a seu antígeno, um local reativo específico na porção “constante” do anticorpo fica descoberto ou “ativado” e essa porção por sua vez se liga diretamente à molécula <b>C1</b> do sistema do complemento, iniciando uma “cascata” de reações sequenciais, como mostrado na Figura 34-6, começando pela ativação da própria proenzima <b>C1</b>.","id":"b13q8","bloco":13,"qn":8,"q":"Qual componente do complemento é ativado inicialmente na via clássica descrita?","o":["C5","C3","C1","C9"],"a":2,"ans":"C1","s":2,"notes":[{"k":"rev","t":"O capítulo registra “Cl”; a resposta registra “C1”. A grafia do capítulo foi preservada.","n":[]}],"orpha es destacam-se:</span>","sents":["As enzimas C1 formadas ativam quantidades sucessivamente maiores de enzimas nos estágios finais do sistema, de modo que, a partir do pequeno início, ocorre a reação extremamente grande e “amplificada”.","Vários produtos finais são formados, como mostrado no lado direito da figura, e muitos desses produtos causam efeitos importantes que ajudam a impedir lesões dos tecidos corporais causadas por microrganismo ou toxina invasora.","Entre esses efeitos importantes destacam-se:"],"fig":null,"qs":[{"j":"As enzimas C1 formadas ativam quantidades sucessivamente maiores de enzimas nos estágios finais do sistema, de modo que, a partir do pequeno início, ocorre a reação extremamente grande e “<b>amplificada</b>”.","id":"b13q11","bloco":13,"qn":11,"q":"Qual propriedade permite que uma ativação inicial do complemento produza uma resposta muito maior?","o":["Amplificação","Neutralização","Precipitação","Aglutinação"],"a":0,"ans":"Amplificação","s":0,"notes":[],"orphan":false,"how":"manual"}]},{"n":73,"part":2,"title":"Opsonização e fagocitose","html":"<span class=\"sn\" data-s=\"0\">1. <mark class=\"kw\" data-q=\"b13q14 b13q15\">Opsonização</mark> e fagocitose.</span> <span class=\"sn\" data-s=\"1\">Um dos produtos da cascata do complemento, <mark class=\"kw\" data-q=\"b13q12 b13q13\">C3b</mark>, ativa com forte intensidade a fagocitose, tanto pelos <mark class=\"kw\" data-q=\"b13q16\">neutrófilos</mark> como pelos <mark class=\"kw\" data-q=\"b13q16\">macrófagos</mark>, fazendo com que essas células engolfem as bactérias presas a complexos antígeno-anticorpos.</span> <span class=\"sn\" data-s=\"2\">Esse processo é chamado <mark class=\"kw\" data-q=\"b13q14 b13q15\">opsonização</mark>. Ele com frequência aumenta, por <mark class=\"kw\" data-q=\"b13q17\">centenas de vezes</mark>, o número de bactérias que pode ser destruído.</span>","sents":["1. Opsonização e fagocitose.","Um dos produtos da cascata do complemento, C3b, ativa com forte intensidade
