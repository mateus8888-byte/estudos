<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style></head><body>
<title>Leitura Ativa da Imunidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: coluna única de leitura. Em cada trecho: ilustração, texto com palavras-chave marcadas e, logo abaixo, todas as perguntas daquele trecho.
   Tokens: azul-defesa (interface), verde (acerto), magenta (erro/inimigo), ouro (marca-texto e dica). */
:root{
  --bg:#EAF1F9; --surface:#FFFFFF; --surface-2:#F2F6FC; --ink:#0E2142; --ink-2:#4F6384; --line:#CFDBEC;
  --def:#2563EB; --def-deep:#1A47B3; --def-soft:#DCE8FF; --on-def:#FFFFFF;
  --ok:#0FA37F; --ok-deep:#097A5F; --ok-soft:#D9F5EC;
  --bad:#E03A5C; --bad-deep:#AE2343; --bad-soft:#FDE2E8;
  --gold:#F2A900; --gold-deep:#9A6A00; --gold-soft:#FFF0BF; --gold-mark:#FFE488;
  --vio:#7B4FD8; --vio-soft:#E9E0FB; --org:#EE7B1B; --org-soft:#FFE6CF; --tea:#0E9FC2; --tea-soft:#D4F1FA; --pnk:#DE5C9B; --pnk-soft:#FBE0EE;
  --f-display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1426; --surface:#122039; --surface-2:#18294A; --ink:#E7EEFB; --ink-2:#9DB0CF; --line:#27395E;
    --def:#6C97FF; --def-deep:#3763D6; --def-soft:#1B2F5C; --on-def:#07142E;
    --ok:#2BD1A3; --ok-deep:#169874; --ok-soft:#0F3A33;
    --bad:#FF6B88; --bad-deep:#C7405E; --bad-soft:#431A2A;
    --gold:#FFC83D; --gold-deep:#FFD978; --gold-soft:#3F3314; --gold-mark:#6B5410;
    --vio:#A98BFF; --vio-soft:#2B2250; --org:#FFA24D; --org-soft:#4A2D12; --tea:#4CD0EE; --tea-soft:#12394A; --pnk:#FF8FC3; --pnk-soft:#4A1F37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1426; --surface:#122039; --surface-2:#18294A; --ink:#E7EEFB; --ink-2:#9DB0CF; --line:#27395E;
  --def:#6C97FF; --def-deep:#3763D6; --def-soft:#1B2F5C; --on-def:#07142E;
  --ok:#2BD1A3; --ok-deep:#169874; --ok-soft:#0F3A33;
  --bad:#FF6B88; --bad-deep:#C7405E; --bad-soft:#431A2A;
  --gold:#FFC83D; --gold-deep:#FFD978; --gold-soft:#3F3314; --gold-mark:#6B5410;
  --vio:#A98BFF; --vio-soft:#2B2250; --org:#FFA24D; --org-soft:#4A2D12; --tea:#4CD0EE; --tea-soft:#12394A; --pnk:#FF8FC3; --pnk-soft:#4A1F37;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:780px;margin-inline:auto}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
.pill svg{width:15px;height:15px}
.gbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:.86rem;color:var(--def)}
.gbtn:hover{border-color:var(--def)}
.prog{flex-basis:100%;height:10px;background:var(--surface);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}

/* leitor */
.reader{display:flex;flex-direction:column;gap:20px;padding-block:20px 56px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--def)}
.reader h1{font-size:clamp(1.55rem,5.4vw,2.1rem)}
.how{background:var(--def-soft);border-radius:16px;padding:14px 16px;font-size:.96rem;display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--f-display);font-weight:600}
.fig{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.fig .imgbtn{display:block;width:100%;border:0;padding:0;background:var(--surface-2);line-height:0;cursor:zoom-in}
.fig img{width:auto;max-width:100%;max-height:360px;height:auto;display:block;margin-inline:auto}
.fig .svgbox{overflow-x:auto;padding:14px 10px 4px;background:var(--surface)}
.fig svg{display:block;width:100%;min-width:430px;height:auto;max-height:330px;margin-inline:auto}
.fig figcaption{padding:8px 14px 10px;font-size:.82rem;color:var(--ink-2);font-weight:700}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 22px;font-size:1.13rem;line-height:1.85;max-width:100%}
.passage mark.kw{background:var(--gold-soft);color:inherit;border-bottom:3px solid var(--gold);border-radius:3px;padding:0 2px;transition:background .15s}
.passage mark.kw.on{background:var(--gold-mark);border-bottom-color:var(--gold-deep)}
.passage .sn{border-radius:6px;transition:background .3s,box-shadow .3s}
.passage .sn.flash{background:var(--def-soft);box-shadow:0 0 0 4px var(--def-soft)}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qhead h2{font-size:1.25rem}
.qcount{font-family:var(--f-display);font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qlist{display:flex;flex-direction:column;gap:14px}
.qc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.qc.act{border-color:var(--def)}
.qc.done{border-color:var(--ok);background:var(--surface)}
.qmeta{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.qmeta .st{margin-left:auto;font-size:.8rem}
.qc.done .qmeta .st{color:var(--ok-deep)}
.qtext{font-size:1.1rem;font-weight:700;max-width:60ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:.98rem;min-width:0;overflow-wrap:anywhere;transition:transform .08s,border-color .15s,background .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:.82rem;color:var(--ink-2)}
.opt:not([disabled]):hover{border-color:var(--def);background:var(--def-soft)}
.opt:not([disabled]):active{transform:translateY(2px)}
.opt.yes{border-color:var(--ok);background:var(--ok-soft)}
.opt.yes .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft);opacity:.75;text-decoration:line-through;text-decoration-thickness:2px}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.out{opacity:.35;text-decoration:line-through}
.opt[disabled]{cursor:default}
.opt.shake{animation:shake .35s}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hbtn{border:0;background:var(--gold);color:#2b1d00;font-family:var(--f-display);font-weight:600;border-radius:10px;padding:6px 14px;box-shadow:0 3px 0 var(--gold-deep)}
:root[data-theme="dark"] .hbtn{color:#1d1400}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.hbtn[disabled]{opacity:.45;pointer-events:none}
.hmsg{font-weight:700;font-size:.92rem;color:var(--gold-deep)}
.msg{font-weight:800;font-size:.92rem}
.msg.bad{color:var(--bad-deep)}
.just{background:var(--ok-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:rise .25s}
.just .jt{font-family:var(--f-display);font-weight:600;color:var(--ok-deep);letter-spacing:.04em}
.just blockquote{margin:0;font-size:1rem;line-height:1.65}
.just blockquote b{background:var(--gold-mark);border-radius:3px;padding:0 3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-weight:800;font-size:.84rem;color:var(--def)}
.note{font-size:.88rem;font-weight:700;background:var(--gold-soft);border-radius:10px;padding:8px 12px;color:var(--ink)}
.rnav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;background:var(--def);color:var(--on-def);box-shadow:0 4px 0 var(--def-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--def-deep)}
.btn.alt{background:var(--surface);color:var(--def);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-deep)}
.btn[disabled]{opacity:.45;pointer-events:none}
.muted{color:var(--ink-2)}
.noq{background:var(--surface-2);border:2px dashed var(--line);border-radius:14px;padding:14px 16px;font-weight:700;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 18px;font-weight:800;font-size:.9rem;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{border:0;background:var(--gold);color:#2b1d00;border-radius:99px;padding:4px 14px;font-weight:800}

/* índice */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(5,12,28,.6);display:flex;justify-content:flex-end}
.drawer .panel{width:min(420px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.drawer h2{font-size:1.3rem;margin-bottom:6px}
.drawer .ph{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--def);margin-top:10px}
.ti{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.92rem;width:100%}
.ti .n{font-family:var(--f-display);color:var(--ink-2);min-width:2.1em;font-variant-numeric:tabular-nums}
.ti .d{margin-left:auto;font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.ti.cur{border-color:var(--def);background:var(--def-soft)}
.ti.all .d{color:var(--ok-deep)}
.lightbox{position:fixed;inset:0;background:rgba(5,12,28,.9);display:grid;place-items:center;padding:16px;z-index:60;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

/* fim */
.end{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tile{background:var(--surface-2);border-radius:14px;padding:12px 8px}
.tile b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--ink-2);font-weight:700}
.revl{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.revl li{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.94rem}
.revl button{border:0;background:none;color:var(--def);font-weight:800;padding:0;text-decoration:underline}

/* ilustrações (SVG) */
.fl-def{fill:var(--def-soft);stroke:var(--def);stroke-width:3}
.fl-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
.fl-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:3}
.fl-gold{fill:var(--gold-soft);stroke:var(--gold);stroke-width:3}
.fl-vio{fill:var(--vio-soft);stroke:var(--vio);stroke-width:3}
.fl-org{fill:var(--org-soft);stroke:var(--org);stroke-width:3}
.fl-tea{fill:var(--tea-soft);stroke:var(--tea);stroke-width:3}
.fl-pnk{fill:var(--pnk-soft);stroke:var(--pnk);stroke-width:3}
.fl-ink{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:3}
.st-def{stroke:var(--def);fill:none;stroke-width:3}.st-ok{stroke:var(--ok);fill:none;stroke-width:3}.st-bad{stroke:var(--bad);fill:none;stroke-width:3}
.st-ink{stroke:var(--ink-2);fill:none;stroke-width:3}.st-vio{stroke:var(--vio);fill:none;stroke-width:3}.st-gold{stroke:var(--gold);fill:none;stroke-width:3}
.ln-def,.ln-ok,.ln-bad,.ln-gold,.ln-vio,.ln-org,.ln-tea,.ln-pnk,.ln-ink{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ln-def{stroke:var(--def)}.ln-ok{stroke:var(--ok)}.ln-bad{stroke:var(--bad)}.ln-gold{stroke:var(--gold)}.ln-vio{stroke:var(--vio)}.ln-org{stroke:var(--org)}.ln-tea{stroke:var(--tea)}.ln-pnk{stroke:var(--pnk)}.ln-ink{stroke:var(--ink-2)}
.sol-def{fill:var(--def)}.sol-ok{fill:var(--ok)}.sol-bad{fill:var(--bad)}.sol-gold{fill:var(--gold)}.sol-vio{fill:var(--vio)}.sol-org{fill:var(--org)}.sol-tea{fill:var(--tea)}.sol-pnk{fill:var(--pnk)}.sol-ink{fill:var(--ink-2)}.sol-bg{fill:var(--surface)}
.lbl{font-family:var(--f-body);font-weight:800;font-size:13.5px;fill:var(--ink);text-anchor:middle}
.lbl2{font-family:var(--f-body);font-weight:700;font-size:13px;fill:var(--ink-2)}
.lblb{font-family:var(--f-body);font-weight:800;font-size:14px;fill:var(--ink)}
.ctx{font-family:var(--f-display);font-weight:700;font-size:22px;fill:var(--ink);text-anchor:middle}
.dim{opacity:.28}
.axis{stroke:var(--ink-2);stroke-width:2;fill:none}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .top .t2,.pill.cnt{display:none}
  .opts{grid-template-columns:1fr}
  .passage{padding:16px 16px;font-size:1.08rem}
  .tiles{grid-template-columns:1fr 1fr 1fr}
}
</style>

<main class="wrap" id="app"></main>
<div class="drawer" id="drawer" hidden><div class="panel" id="panel"></div></div>

anhas e mesmo algumas células infectadas."],"fig":"figs/f09.jpg","qs":[{"j":"e (4) linfócitos <b>natural killer</b>, que podem reconhecer e destruir células estranhas e mesmo algumas células infectadas.","id":"b1q18","bloco":1,"qn":18,"q":"Quais linfócitos reconhecem e destroem células estranhas ou infectadas na imunidade inata?","o":["Plasmócitos","Linfócitos B","Natural killer","Neutrófilos"],"a":2,"ans":"Natural killer","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"e (4) linfócitos <b>natural killer</b>, que podem reconhecer e destruir células estranhas e mesmo algumas células infectadas.","id":"b1q19","bloco":1,"qn":19,"q":"Como são chamadas as células NK?","o":["Natural killer","Natural helper","Neutrophil killer","Nuclear killer"],"a":0,"ans":"Natural killer","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":10,"part":1,"title":"Resistência natural entre espécies","html":"<span class=\"sn\" data-s=\"0\">Essa imunidade inata torna o corpo humano resistente a doenças, como algumas infecções virais paralíticas em animais, cólera suína, praga do gado e <mark class=\"kw\" data-q=\"b1q20\">cinomose</mark> — doença virótica que mata grande porcentagem dos cães infectados.</span> <span class=\"sn\" data-s=\"1\">Inversamente, muitos animais inferiores são resistentes ou até mesmo imunes a muitas doenças humanas, como a <mark class=\"kw\" data-q=\"b1q21\">poliomielite</mark>, <mark class=\"kw\" data-q=\"b1q22\">caxumba</mark>, cólera humana, sarampo e sífilis, que são debilitantes ou até letais para os seres humanos.</span>","sents":["Essa imunidade inata torna o corpo humano resistente a doenças, como algumas infecções virais paralíticas em animais, cólera suína, praga do gado e cinomose — doença virótica que mata grande porcentagem dos cães infectados.","Inversamente, muitos animais inferiores são resistentes ou até mesmo imunes a muitas doenças humanas, como a poliomielite, caxumba, cólera humana, sarampo e sífilis, que são debilitantes ou até letais para os seres humanos."],"fig":"figs/f10.jpg","qs":[{"j":"Essa imunidade inata torna o corpo humano resistente a doenças, como algumas infecções virais paralíticas em animais, cólera suína, praga do gado e <b>cinomose</b> — doença virótica que mata grande porcentagem dos cães infectados.","id":"b1q20","bloco":1,"qn":20,"q":"Qual doença viral dos cães é citada como exemplo de resistência natural humana?","o":["Poliomielite","Raiva","Sarampo","Cinomose"],"a":3,"ans":"Cinomose","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Inversamente, muitos animais inferiores são resistentes ou até mesmo imunes a muitas doenças humanas, como a <b>poliomielite</b>, caxumba, cólera humana, sarampo e sífilis, que são debilitantes ou até letais para os seres humanos.","id":"b1q21","bloco":1,"qn":21,"q":"Qual doença humana de origem viral é citada como exemplo de resistência de animais inferiores?","o":["Cinomose","Poliomielite","Cólera suína","Peste bovina"],"a":1,"ans":"Poliomielite","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Inversamente, muitos animais inferiores são resistentes ou até mesmo imunes a muitas doenças humanas, como a poliomielite, <b>caxumba</b>, cólera humana, sarampo e sífilis, que são debilitantes ou até letais para os seres humanos.","id":"b1q22","bloco":1,"qn":22,"q":"Qual doença humana causada por vírus e caracterizada por aumento das glândulas salivares aparece entre os exemplos de resistência animal?","o":["Poliomielite","Sífilis","Sarampo","Caxumba"],"a":3,"ans":"Caxumba","s":1,"notes":[{"k":"rev","t":"Bloco 1, Questão 22 — a caxumba consta entre os exemplos, mas a caracterização por aumento das glândulas salivares não consta no capítulo fornecido.","n":[]}],"orphan":false,"how":"full"}]},{"n":11,"part":1,"title":"Imunidade adquirida ou adaptativa","html":"<span class=\"sn\" data-s=\"0\"><mark class=\"kw\" data-q=\"b2q1 b2q2\">Imunidade</mark><mark class=\"kw\" data-q=\"b2q1\"> Adquirida</mark> (<mark class=\"kw\" data-q=\"b2q2\">Adaptativa</mark>) Além da imunidade inata generalizada, o corpo humano tem a capacidade de desenvolver imunidade específica extremamente potente contra agentes invasores individuais como bactérias, vírus e toxinas letais e até mesmo tecidos estranhos de outros animais.</span> <span class=\"sn\" data-s=\"1\">Essa é a chamada imunidade adquirida ou adaptativa.</span> <span class=\"sn\" data-s=\"2\">A <mark class=\"kw\" data-q=\"b2q3\">imunidade adquirida</mark> é causada por sistema imune especial formador de <mark class=\"kw\" data-q=\"b2q4\">anticorpos</mark> e/ou linfócitos ativados que atacam e destroem organismos invasores específicos ou toxinas.</span> <span class=\"sn\" data-s=\"3\">Este capítulo discute esse mecanismo de imunidade adquirida e algumas de suas reações associadas — especialmente as alergias.</span>","sents":["Imunidade Adquirida (Adaptativa) Além da imunidade inata generalizada, o corpo humano tem a capacidade de desenvolver imunidade específica extremamente potente contra agentes invasores individuais como bactérias, vírus e toxinas letais e até mesmo tecidos estranhos de outros animais.","Essa é a chamada imunidade adquirida ou adaptativa.","A imunidade adquirida é causada por sistema imune especial formador de anticorpos e/ou linfócitos ativados que atacam e destroem organismos invasores específicos ou toxinas.","Este capítulo discute esse mecanismo de imunidade adquirida e algumas de suas reações associadas — especialmente as alergias."],"fig":"figs/f11.jpg","qs":[{"j":"<b>Imunidade Adquirida</b> (Adaptativa) Além da imunidade inata generalizada, o corpo humano tem a capacidade de desenvolver imunidade específica extremamente potente contra agentes invasores individuais como bactérias, vírus e toxinas letais e até mesmo tecidos estranhos de outros animais.","id":"b2q1","bloco":2,"qn":1,"q":"Como se chama a imunidade específica desenvolvida contra agentes invasores individuais?","o":["Fagocitose","Imunidade inata","Imunidade adquirida","Imunidade passiva"],"a":2,"ans":"Imunidade adquirida","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"<b>Imunidade</b> Adquirida (<b>Adaptativa</b>) Além da imunidade inata generalizada, o corpo humano tem a capacidade de desenvolver imunidade específica extremamente potente contra agentes invasores individuais como bactérias, vírus e toxinas letais e até mesmo tecidos estranhos de outros animais.","id":"b2q2","bloco":2,"qn":2,"q":"Qual é o outro nome da imunidade adquirida?","o":["Imunidade inata","Imunidade natural","Imunidade adaptativa","Imunidade humoral"],"a":2,"ans":"Imunidade adaptativa","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"A <b>imunidade adquirida</b> é causada por sistema imune especial formador de anticorpos e/ou linfócitos ativados que atacam e destroem organismos invasores específicos ou toxinas.","id":"b2q3","bloco":2,"qn":3,"q":"Qual imunidade forma anticorpos ou linfócitos ativados contra agentes específicos?","o":["Fagocitose","Complemento","Imunidade adquirida","Imunidade inata"],"a":2,"ans":"Imunidade adquirida","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"A imunidade adquirida é causada por sistema imune especial formador de <b>anticorpos</b> e/ou linfócitos ativados que atacam e destroem organismos invasores específicos ou toxinas.","id":"b2q4","bloco":2,"qn":4,"q":"Quais moléculas produzidas pelo sistema imune atacam antígenos específicos?","o":["Hormônios","Eritrócitos","Enzimas digestivas","Anticorpos"],"a":3,"ans":"Anticorpos","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":12,"part":1,"title":"Potência da proteção adquirida e imunização","html":"<span class=\"sn\" data-s=\"0\">A imunidade adquirida dá, em geral, proteção extrema.</span> <span class=\"sn\" data-s=\"1\">Por exemplo, certas toxinas, como a <mark class=\"kw\" data-q=\"b2q6\">toxina botulínica</mark> paralítica ou a <mark class=\"kw\" data-q=\"b2q7\">toxina tetanizante</mark> do tétano, podem ser inativadas em doses superiores a <mark class=\"kw\" data-q=\"b2q8\">100.000 vezes</mark> a quantidade que seria letal sem imunidade.</span> <span class=\"sn\" data-s=\"2\">Esse é o motivo pelo qual o processo de tratamento, conhecido como <mark class=\"kw\" data-q=\"b2q5\">imunização</mark>, é tão importante na proteção de seres humanos contra doenças e contra toxinas como será explicado no curso deste capítulo.</span>","sents":["A imunidade adquirida dá, em geral, proteção extrema.","Por exemplo, certas toxinas, como a toxina botulínica paralítica ou a toxina tetanizante do tétano, podem ser inativadas em doses superiores a 100.000 vezes a quantidade que seria letal sem imunidade.","Esse é o motivo pelo qual o processo de tratamento, conhecido como imunização, é tão importante na proteção de seres humanos contra doenças e contra toxinas como será explicado no curso deste capítulo."],"fig":"figs/f12.jpg","qs":[{"j":"Esse é o motivo pelo qual o processo de tratamento, conhecido como <b>imunização</b>, é tão importante na proteção de seres humanos contra doenças e contra toxinas como será explicado no curso deste capítulo.","id":"b2q5","bloco":2,"qn":5,"q":"Como se chama o processo utilizado para desenvolver proteção imunológica contra doenças?","o":["Inflamação","Aglutinação","Imunização","Fagocitose"],"a":2,"ans":"Imunização","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Por exemplo, certas toxinas, como a <b>toxina botulínica</b> paralítica ou a toxina tetanizante do tétano, podem ser inativadas em doses superiores a 100.000 vezes a quantidade que seria letal sem imunidade.","id":"b2q6","bloco":2,"qn":6,"q":"Qual toxina paralítica é citada como exemplo de proteção adquirida extremamente potente?","o":["Toxina tetanizante","Toxina diftérica","Toxina botulínica","Toxina colérica"],"a":2,"ans":"Toxina botulínica","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Por exemplo, certas toxinas, como a toxina botulínica paralítica ou a <b>toxina tetanizante</b> do tétano, podem ser inativadas em doses superiores a 100.000 vezes a quantidade que seria letal sem imunidade.","id":"b2q7","bloco":2,"qn":7,"q":"Qual toxina está associada ao tétano?","o":["Toxina colérica","Toxina botulínica","Toxina tetanizante","Toxina diftérica"],"a":2,"ans":"Toxina tetanizante","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Por exemplo, certas toxinas, como a toxina botulínica paralítica ou a toxina tetanizante do tétano, podem ser inativadas em doses superiores a <b>100.000 vezes</b> a quantidade que seria letal sem imunidade.","id":"b2q8","bloco":2,"qn":8,"q":"Quantas vezes a dose letal de determinadas toxinas pode ser superada pela proteção imunológica descrita?","o":["100.000 vezes","10 vezes","100 vezes","1.000 vezes"],"a":0,"ans":"100.000 vezes","s":1,"notes":[{"k":"conf","t":"Bloco 2, Questão 8 — a resposta registra “100.000 vezes”; o capítulo registra “doses superiores a 100.000 vezes”. A resposta original foi preservada.","n":[]}],"orphan":false,"how":"full"}]},{"n":13,"part":1,"title":"Imunidade humoral","html":"<span class=\"sn\" data-s=\"0\">Tipos Básicos de Imunidade Adquirida — Humoral e Mediada por Células No corpo, ocorrem dois tipos básicos e aliados de imunidade adquirida.</span> <span class=\"sn\" data-s=\"1\">Em um deles, o corpo desenvolve anticorpos circulantes, que são moléculas de <mark class=\"kw\" data-q=\"b2q14\">globulina</mark> no <mark class=\"kw\" data-q=\"b2q13\">plasma sanguíneo</mark>, capazes de atacar o agente invasor.</span> <span class=\"sn\" data-s=\"2\">Esse tipo de imunidade é chamado de <mark class=\"kw\" data-q=\"b2q10 b2q11\">imunidade humoral</mark> ou imunidade das células B (porque os <mark class=\"kw\" data-q=\"b2q12\">linfócitos B</mark> produzem os anticorpos).</span>","sents":["Tipos Básicos de Imunidade Adquirida — Humoral e Mediada por Células No corpo, ocorrem dois tipos básicos e aliados de imunidade adquirida.","Em um deles, o corpo desenvolve anticorpos circulantes, que são moléculas de globulina no plasma sanguíneo, capazes de atacar o agente invasor.","Esse tipo de imunidade é chamado de imunidade humoral ou imunidade das células B (porque os linfócitos B produzem os anticorpos)."],"fig":"figs/f13.jpg","qs":[{"j":"Esse tipo de imunidade é chamado de <b>imunidade humoral</b> ou imunidade das células B (porque os linfócitos B produzem os anticorpos).","id":"b2q10","bloco":2,"qn":10,"q":"Qual imunidade depende dos anticorpos circulantes?","o":["Imunidade inata","Imunidade T","Imunidade humoral","Imunidade celular"],"a":2,"ans":"Imunidade humoral","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Esse tipo de imunidade é chamado de <b>imunidade humoral</b> ou imunidade das células B (porque os linfócitos B produzem os anticorpos).","id":"b2q11","bloco":2,"qn":11,"q":"Qual imunidade é conhecida como imunidade das células B?","o":["Imunidade passiva","Imunidade humoral","Imunidade celular","Imunidade inata"],"a":1,"ans":"Imunidade humoral","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Esse tipo de imunidade é chamado de imunidade humoral ou imunidade das células B (porque os <b>linfócitos B</b> produzem os anticorpos).","id":"b2q12","bloco":2,"qn":12,"q":"Quais linfócitos produzem os anticorpos da imunidade humoral?","o":["Linfócitos T","Neutrófilos","Macrófagos","Linfócitos B"],"a":3,"ans":"Linfócitos B","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Em um deles, o corpo desenvolve anticorpos circulantes, que são moléculas de globulina no <b>plasma sanguíneo</b>, capazes de atacar o agente invasor.","id":"b2q13","bloco":2,"qn":13,"q":"Em qual componente do sangue circulam os anticorpos descritos?","o":["Hemácias","Plaquetas","Linfa","Plasma sanguíneo"],"a":3,"ans":"Plasma sanguíneo","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Em um deles, o corpo desenvolve anticorpos circulantes, que são moléculas de <b>globulina</b> no plasma sanguíneo, capazes de atacar o agente invasor.","id":"b2q14","bloco":2,"qn":14,"q":"Qual tipo de molécula constitui os anticorpos circulantes?","o":["Glicogênio","Lipídeo","Hormônio esteroide","Globulina"],"a":3,"ans":"Globulina","s":1,"notes":[],"orphan":false,"how":"full"}]},{"n":14,"part":1,"title":"Imunidade mediada por células","html":"<span class=\"sn\" data-s=\"0\">O segundo tipo de <mark class=\"kw\" data-q=\"b2q15 b2q16\">imunidade</mark> adquirida é dependente da formação de grande número de <mark class=\"kw\" data-q=\"b2q17\">linfócitos T</mark> ativados, especialmente produzidos nos <mark class=\"kw\" data-q=\"b2q18\">linfonodos</mark> para destruir o agente estranho.</span> <span class=\"sn\" data-s=\"1\">Esse tipo de imunidade é chamado de imunidade mediada por <mark class=\"kw\" data-q=\"b2q9\">células</mark> ou imunidade das células T (porque os linfócitos ativados são <mark class=\"kw\" data-q=\"b2q17\">linfócitos T</mark>).</span> <span class=\"sn\" data-s=\"2\">Veremos em breve que os anticorpos e os linfócitos ativados são formados nos tecidos Dois Tipos de Linfócitos Promovem a Imunidade linfoides do corpo.</span> <span class=\"sn\" data-s=\"3\">Vamos discutir o início do processo imune pelos antígenos.</span>","sents":["O segundo tipo de imunidade adquirida é dependente da formação de grande número de linfócitos T ativados, especialmente produzidos nos linfonodos para destruir o agente estranho.","Esse tipo de imunidade é chamado de imunidade mediada por células ou imunidade das células T (porque os linfócitos ativados são linfócitos T).","Veremos em breve que os anticorpos e os linfócitos ativados são formados nos tecidos Dois Tipos de Linfócitos Promovem a Imunidade linfoides do corpo.","Vamos discutir o início do processo imune pelos antígenos."],"fig":"figs/f14.jpg","qs":[{"j":"Esse tipo de imunidade é chamado de imunidade mediada por <b>células</b> ou imunidade das células T (porque os linfócitos ativados são linfócitos T).","id":"b2q9","bloco":2,"qn":9,"q":"Quais são os dois tipos básicos de imunidade adquirida?","o":["Celular e inata","Humoral e inata","Inata e passiva","Humoral e celular"],"a":3,"ans":"Humoral e celular","s":1,"notes":[{"k":"ref","t":"Trechos 13 e 14.","n":[13,14]}],"orphan":false,"how":"words"},{"j":"O segundo tipo de <b>imunidade</b> adquirida é dependente da formação de grande número de linfócitos T ativados, especialmente produzidos nos linfonodos para destruir o agente estranho.","id":"b2q15","bloco":2,"qn":15,"q":"Qual imunidade depende de linfócitos T ativados?","o":["Imunidade celular","Imunidade humoral","Imunidade B","Imunidade inata"],"a":0,"ans":"Imunidade celular","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"O segundo tipo de <b>imunidade</b> adquirida é dependente da formação de grande número de linfócitos T ativados, especialmente produzidos nos linfonodos para destruir o agente estranho.","id":"b2q16","bloco":2,"qn":16,"q":"Qual outro nome recebe a imunidade celular?","o":["Imunidade humoral","Imunidade T","Imunidade B","Imunidade inata"],"a":1,"ans":"Imunidade T","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Esse tipo de imunidade é chamado de imunidade mediada por células ou imunidade das células T (porque os linfócitos ativados são <b>linfócitos T</b>).","id":"b2q17","bloco":2,"qn":17,"q":"Quais linfócitos são responsáveis pela imunidade mediada por células?","o":["Linfócitos B","Linfócitos T","Macrófagos","Neutrófilos"],"a":1,"ans":"Linfócitos T","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"O segundo tipo de imunidade adquirida é dependente da formação de grande número de linfócitos T ativados, especialmente produzidos nos <b>linfonodos</b> para destruir o agente estranho.","id":"b2q18","bloco":2,"qn":18,"q":"Em quais estruturas linfoides os linfócitos T ativados são especialmente produzidos?","o":["Timo","Baço","Fígado","Linfonodos"],"a":3,"ans":"Linfonodos","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":15,"part":1,"title":"Antígenos e desencadeamento da imunidade adquirida","html":"<span class=\"sn\" data-s=\"0\">Ambos os Tipos de <mark class=\"kw\" data-q=\"b3q3\">Imunidade Adquirida</mark> São Desencadeados por <mark class=\"kw\" data-q=\"b3q1 b3q2\">Antígenos</mark> Como a <mark class=\"kw\" data-q=\"b3q3\">imunidade adquirida</mark> não se desenvolve antes da invasão por microrganismo ou toxina estranha, está claro que o organismo deve ter algum mecanismo de reconhecimento dessa invasão.</span> <span class=\"sn\" data-s=\"1\">Cada toxina ou cada tipo de microrganismo quase sempre contém um ou mais compostos químicos específicos que são diferentes de todos os outros compostos.</span> <span class=\"sn\" data-s=\"2\">Em geral, esses compostos são <mark class=\"kw\" data-q=\"b3q4\">proteínas</mark> ou <mark class=\"kw\" data-q=\"b3q5\">grandes polissacarídeos</mark> e são eles que desencadeiam a <mark class=\"kw\" data-q=\"b3q3\">imunidade adquirida</mark>.</span> <span class=\"sn\" data-s=\"3\">Essas substâncias são chamadas <mark class=\"kw\" data-q=\"b3q1 b3q2\">antígenos</mark> (do inglês, antibody generators, geradores de anticorpos).</span>","sents":["Ambos os Tipos de Imunidade Adquirida São Desencadeados por Antígenos Como a imunidade adquirida não se desenvolve antes da invasão por microrganismo ou toxina estranha, está claro que o organismo deve ter algum mecanismo de reconhecimento dessa invasão.","Cada toxina ou cada tipo de microrganismo quase sempre contém um ou mais compostos químicos específicos que são diferentes de todos os outros compostos.","Em geral, esses compostos são proteínas ou grandes polissacarídeos e são eles que desencadeiam a imunidade adquirida.","Essas substâncias são chamadas antígenos (do inglês, antibody generators, geradores de anticorpos)."],"fig":"figs/f15.jpg","qs":[{"j":"Ambos os Tipos de Imunidade Adquirida São Desencadeados por <b>Antígenos</b> Como a imunidade adquirida não se desenvolve antes da invasão por microrganismo ou toxina estranha, está claro que o organismo deve ter algum mecanismo de reconhecimento dessa invasão.","id":"b3q1","bloco":3,"qn":1,"q":"Como são chamadas as substâncias que desencadeiam imunidade adquirida?","o":["Interleucinas","Epítopos","Anticorpos","Antígenos"],"a":3,"ans":"Antígenos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Ambos os Tipos de Imunidade Adquirida São Desencadeados por <b>Antígenos</b> Como a imunidade adquirida não se desenvolve antes da invasão por microrganismo ou toxina estranha, está claro que o organismo deve ter algum mecanismo de reconhecimento dessa invasão.","id":"b3q2","bloco":3,"qn":2,"q":"Quais substâncias estimulam o desenvolvimento de respostas imunológicas específicas?","o":["Reaginas","Epítopos","Anticorpos","Antígenos"],"a":3,"ans":"Antígenos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Ambos os Tipos de <b>Imunidade Adquirida</b> São Desencadeados por Antígenos Como a <b>imunidade adquirida</b> não se desenvolve antes da invasão por microrganismo ou toxina estranha, está claro que o organismo deve ter algum mecanismo de reconhecimento dessa invasão.","id":"b3q3","bloco":3,"qn":3,"q":"Qual tipo de imunidade é desencadeado por antígenos?","o":["Imunidade passiva","Imunidade inata","Imunidade adquirida","Fagocitose"],"a":2,"ans":"Imunidade adquirida","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Em geral, esses compostos são <b>proteínas</b> ou grandes polissacarídeos e são eles que desencadeiam a imunidade adquirida.","id":"b3q4","bloco":3,"qn":4,"q":"Qual classe de macromoléculas é frequentemente antigênica?","o":["Vitaminas","Proteínas","Ácidos graxos","Lipídeos"],"a":1,"ans":"Proteínas","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Em geral, esses compostos são proteínas ou <b>grandes polissacarídeos</b> e são eles que desencadeiam a imunidade adquirida.","id":"b3q5","bloco":3,"qn":5,"q":"Quais carboidratos complexos frequentemente apresentam antigenicidade?","o":["Pequenos peptídeos","Grandes polissacarídeos","Íons inorgânicos","Lipídeos"],"a":1,"ans":"Grandes polissacarídeos","s":2,"notes":[],"orphan":false,"how":"full"}]},{"n":16,"part":1,"title":"Peso molecular e antigenicidade","html":"<span class=\"sn\" data-s=\"0\">Para que a substância seja antigênica, ela deve em geral ter alto peso molecular, de <mark class=\"kw\" data-q=\"b3q6\">8.000</mark> ou mais.</span>","sents":["Para que a substância seja antigênica, ela deve em geral ter alto peso molecular, de 8.000 ou mais."],"fig":"figs/f16.jpg","qs":[{"j":"Para que a substância seja antigênica, ela deve em geral ter alto peso molecular, de <b>8.000</b> ou mais.","id":"b3q6","bloco":3,"qn":6,"q":"Qual peso molecular mínimo geralmente está associado à antigenicidade descrita?","o":["8.000","80.000","800","800.000"],"a":0,"ans":"8.000","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":17,"part":1,"title":"Epítopos e características estereoquímicas","html":"<span class=\"sn\" data-s=\"0\">Além disso, o processo de <mark class=\"kw\" data-q=\"b3q11\">antigenicidade</mark> depende usualmente de grupos <mark class=\"kw\" data-q=\"b3q9 b3q12\">moleculares</mark> que recorrem de forma regular, chamados <mark class=\"kw\" data-q=\"b3q7 b3q8\">epítopos</mark>, na <mark class=\"kw\" data-q=\"b3q9\">superfície</mark> das grandes moléculas.</span> <span class=\"sn\" data-s=\"1\">Esse fato explica, também, porque proteínas e grandes polissacarídeos são quase sempre antigênicos, já que apresentam essa característica <mark class=\"kw\" data-q=\"b3q10\">estereoquímica</mark>.</span>","sents":["Além disso, o processo de antigenicidade depende usualmente de grupos moleculares que recorrem de forma regular, chamados epítopos, na superfície das grandes moléculas.","Esse fato explica, também, porque proteínas e grandes polissacarídeos são quase sempre antigênicos, já que apresentam essa característica estereoquímica."],"fig":"figs/f17.jpg","qs":[{"j":"Além disso, o processo de antigenicidade depende usualmente de grupos moleculares que recorrem de forma regular, chamados <b>epítopos</b>, na superfície das grandes moléculas.","id":"b3q7","bloco":3,"qn":7,"q":"Como se chamam os grupos moleculares específicos responsáveis pela antigenicidade?","o":["Autoantígenos","Anticorpos","Reaginas","Epítopos"],"a":3,"ans":"Epítopos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Além disso, o processo de antigenicidade depende usualmente de grupos moleculares que recorrem de forma regular, chamados <b>epítopos</b>, na superfície das grandes moléculas.","id":"b3q8","bloco":3,"qn":8,"q":"Qual é o nome das estruturas repetitivas reconhecidas nas superfícies antigênicas?","o":["Receptores","Epítopos","Autoantígenos","Clones"],"a":1,"ans":"Epítopos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Além disso, o processo de antigenicidade depende usualmente de grupos <b>moleculares</b> que recorrem de forma regular, chamados epítopos, na <b>superfície</b> das grandes moléculas.","id":"b3q9","bloco":3,"qn":9,"q":"Onde geralmente se localizam os epítopos descritos?","o":["Núcleo","Citoplasma","Membrana basal","Superfície molecular"],"a":3,"ans":"Superfície molecular","s":0,"notes":[],"orphan":false,"how":"words"},{"j":"Esse fato explica, também, porque proteínas e grandes polissacarídeos são quase sempre antigênicos, já que apresentam essa característica <b>estereoquímica</b>.","id":"b3q10","bloco":3,"qn":10,"q":"Qual característica estrutural das macromoléculas contribui para a antigenicidade?","o":["Carga elétrica neutra","Organização lipídica","Baixa solubilidade","Organização estereoquímica"],"a":3,"ans":"Organização estereoquímica","s":1,"notes":[],"orphan":false,"how":"words"},{"j":"Além disso, o processo de <b>antigenicidade</b> depende usualmente de grupos moleculares que recorrem de forma regular, chamados epítopos, na superfície das grandes moléculas.","id":"b3q11","bloco":3,"qn":11,"q":"Qual nome recebe a capacidade de uma substância apresentar propriedades antigênicas?","o":["Toxicidade","Imunidade","Alergenicidade","Antigenicidade"],"a":3,"ans":"Antigenicidade","s":0,"notes":[{"k":"ref","t":"Trechos 16 e 17.","n":[16,17]}],"orphan":false,"how":"full"},{"j":"Além disso, o processo de antigenicidade depende usualmente de grupos <b>moleculares</b> que recorrem de forma regular, chamados epítopos, na superfície das grandes moléculas.","id":"b3q12","bloco":3,"qn":12,"q":"Qual propriedade molecular, além da organização dos epítopos, influencia a antigenicidade?","o":["Peso molecular","Cor","Temperatura","Volume"],"a":0,"ans":"Peso molecular","s":0,"notes":[{"k":"ref","t":"Trecho 16.","n":[16]}],"orphan":false,"how":"words"}]},{"n":18,"part":1,"title":"Linfócitos e sobrevivência","html":"<span class=\"sn\" data-s=\"0\">Os Linfócitos São Responsáveis pela Imunidade Adquirida A imunidade adquirida é produto dos linfócitos do corpo.</span> <span class=\"sn\" data-s=\"1\">Em pessoas com ausência genética de <mark class=\"kw\" data-q=\"b4q1 b4q2\">linfócitos</mark> ou cujos <mark class=\"kw\" data-q=\"b4q1 b4q2\">linfócitos</mark> tenham sido destruídos pela <mark class=\"kw\" data-q=\"b4q4\">radiação</mark> ou por produtos químicos, nenhuma imunidade adquirida pode se desenvolver.</span> <span class=\"sn\" data-s=\"2\">E poucos dias após nascer tal pessoa morre por <mark class=\"kw\" data-q=\"b4q3\">infecção bacteriana</mark> fulminante, a menos que seja tratada com medidas heróicas.</span> <span class=\"sn\" data-s=\"3\">Assim, fica claro que os linfócitos são essenciais para a sobrevida do ser humano.</span>","sents":["Os Linfócitos São Responsáveis pela Imunidade Adquirida A imunidade adquirida é produto dos linfócitos do corpo.","Em pessoas com ausência genética de linfócitos ou cujos linfócitos tenham sido destruídos pela radiação ou por produtos químicos, nenhuma imunidade adquirida pode se desenvolver.","E poucos dias após nascer tal pessoa morre por infecção bacteriana fulminante, a menos que seja tratada com medidas heróicas.","Assim, fica claro que os linfócitos são essenciais para a sobrevida do ser humano."],"fig":"figs/f18.jpg","qs":[{"j":"Em pessoas com ausência genética de <b>linfócitos</b> ou cujos <b>linfócitos</b> tenham sido destruídos pela radiação ou por produtos químicos, nenhuma imunidade adquirida pode se desenvolver.","id":"b4q1","bloco":4,"qn":1,"q":"Quais células são essenciais para o desenvolvimento da imunidade adquirida?","o":["Linfócitos","Plaquetas","Hemácias","Neutrófilos"],"a":0,"ans":"Linfócitos","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"Em pessoas com ausência genética de <b>linfócitos</b> ou cujos <b>linfócitos</b> tenham sido destruídos pela radiação ou por produtos químicos, nenhuma imunidade adquirida pode se desenvolver.","id":"b4q2","bloco":4,"qn":2,"q":"Qual população celular, quando geneticamente ausente, impede a formação de imunidade adquirida?","o":["Linfócitos","Hemácias","Plaquetas","Macrófagos"],"a":0,"ans":"Linfócitos","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"E poucos dias após nascer tal pessoa morre por <b>infecção bacteriana</b> fulminante, a menos que seja tratada com medidas heróicas.","id":"b4q3","bloco":4,"qn":3,"q":"Qual tipo de infecção fulminante pode causar morte em pessoas sem linfócitos?","o":["Infecção parasitária","Infecção fúngica","Infecção bacteriana","Infecção viral"],"a":2,"ans":"Infecção bacteriana","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"Em pessoas com ausência genética de linfócitos ou cujos linfócitos tenham sido destruídos pela <b>radiação</b> ou por produtos químicos, nenhuma imunidade adquirida pode se desenvolver.","id":"b4q4","bloco":4,"qn":4,"q":"Qual exposição física pode destruir linfócitos e comprometer a imunidade adquirida?","o":["Pressão","Frio","Radiação","Calor"],"a":2,"ans":"Radiação","s":1,"notes":[],"orphan":false,"how":"full"}]},{"n":19,"part":1,"title":"Localização dos linfócitos","html":"<span class=\"sn\" data-s=\"0\">Os linfócitos ficam situados, em maior número, nos <mark class=\"kw\" data-q=\"b4q5\">linfonodos</mark>, mas também se encontram em tecidos linfoides especiais como no <mark class=\"kw\" data-q=\"b4q6\">baço</mark>, nas áreas <mark class=\"kw\" data-q=\"b4q9\">submucosas</mark> do trato gastrointestinal, no timo e na <mark class=\"kw\" data-q=\"b4q8\">medula óssea</mark>.</span>","sents":["Os linfócitos ficam situados, em maior número, nos linfonodos, mas também se encontram em tecidos linfoides especiais como no baço, nas áreas submucosas do trato gastrointestinal, no timo e na medula óssea."],"fig":"figs/f19.jpg","qs":[{"j":"Os linfócitos ficam situados, em maior número, nos <b>linfonodos</b>, mas também se encontram em tecidos linfoides especiais como no baço, nas áreas submucosas do trato gastrointestinal, no timo e na medula óssea.","id":"b4q5","bloco":4,"qn":5,"q":"Onde se encontra a maior quantidade de linfócitos mencionada no capítulo?","o":["Baço","Linfonodos","Fígado","Estômago"],"a":1,"ans":"Linfonodos","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os linfócitos ficam situados, em maior número, nos linfonodos, mas também se encontram em tecidos linfoides especiais como no <b>baço</b>, nas áreas submucosas do trato gastrointestinal, no timo e na medula óssea.","id":"b4q6","bloco":4,"qn":6,"q":"Qual órgão abdominal contém tecido linfoide e participa da defesa imunológica?","o":["Pâncreas","Rim","Baço","Fígado"],"a":2,"ans":"Baço","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os linfócitos ficam situados, em maior número, nos linfonodos, mas também se encontram em tecidos linfoides especiais como no baço, nas áreas submucosas do trato gastrointestinal, no timo e na <b>medula óssea</b>.","id":"b4q8","bloco":4,"qn":8,"q":"Qual tecido hematopoiético também abriga linfócitos?","o":["Pele","Coração","Pulmão","Medula óssea"],"a":3,"ans":"Medula óssea","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os linfócitos ficam situados, em maior número, nos linfonodos, mas também se encontram em tecidos linfoides especiais como no baço, nas áreas <b>submucosas</b> do trato gastrointestinal, no timo e na medula óssea.","id":"b4q9","bloco":4,"qn":9,"q":"Em qual região da parede gastrointestinal também existe tecido linfoide?","o":["Mucosa","Adventícia","Serosa","Submucosa"],"a":3,"ans":"Submucosa","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":20,"part":1,"title":"Transporte e interceptação de antígenos","html":"<span class=\"sn\" data-s=\"0\">O tecido linfoide se distribui vantajosamente pelo corpo para interceptar microrganismos invasores ou toxinas, antes que possam se disseminar.</span> <span class=\"sn\" data-s=\"1\">Na maioria dos casos, o agente invasor primeiramente penetra nos líquidos teciduais e depois é transportado para <mark class=\"kw\" data-q=\"b4q12\">linfonodos</mark> ou outros tecidos linfoides pelos <mark class=\"kw\" data-q=\"b4q10\">vasos </mark><mark class=\"kw\" data-q=\"b4q10 b4q14\">linfáticos</mark>.</span> <span class=\"sn\" data-s=\"2\">Por exemplo, o tecido linfoide das paredes <mark class=\"kw\" data-q=\"b4q15\">gastrointestinais</mark> é exposto imediatamente aos antígenos que invadem o intestino.</span> <span class=\"sn\" data-s=\"3\">O tecido linfoide da garganta e da faringe (as <mark class=\"kw\" data-q=\"b4q11\">tonsilas</mark> e as <mark class=\"kw\" data-q=\"b4q11\">adenoides</mark>) está bem localizado para interceptar antígenos que entram pelo trato respiratório superior.</span> <span class=\"sn\" data-s=\"4\">O tecido linfoide nos <mark class=\"kw\" data-q=\"b4q12\">linfonodos</mark> é exposto aos antígenos que invadem os tecidos periféricos do corpo.</span> <span class=\"sn\" data-s=\"5\">Finalmente, o tecido linfoide do <mark class=\"kw\" data-q=\"b4q13\">baço</mark>, do timo e da medula óssea tem participação específica na interceptação dos agentes antigênicos que tenham conseguido chegar ao sangue circulante.</span>","sents":["O tecido linfoide se distribui vantajosamente pelo corpo para interceptar microrganismos invasores ou toxinas, antes que possam se disseminar.","Na maioria dos casos, o agente invasor primeiramente penetra nos líquidos teciduais e depois é transportado para linfonodos ou outros tecidos linfoides pelos vasos linfáticos.","Por exemplo, o tecido linfoide das paredes gastrointestinais é exposto imediatamente aos antígenos que invadem o intestino.","O tecido linfoide da garganta e da faringe (as tonsilas e as adenoides) está bem localizado para interceptar antígenos que entram pelo trato respiratório superior.","O tecido linfoide nos linfonodos é exposto aos antígenos que invadem os tecidos periféricos do corpo.","Finalmente, o tecido linfoide do baço, do timo e da medula óssea tem participação específica na interceptação dos agentes antigênicos que tenham conseguido chegar ao sangue circulante."],"fig":"figs/f20.jpg","qs":[{"j":"Na maioria dos casos, o agente invasor primeiramente penetra nos líquidos teciduais e depois é transportado para linfonodos ou outros tecidos linfoides pelos <b>vasos linfáticos</b>.","id":"b4q10","bloco":4,"qn":10,"q":"Por quais vasos os agentes antigênicos dos tecidos são transportados para os linfonodos?","o":["Vasos linfáticos","Capilares sanguíneos","Artérias","Veias"],"a":0,"ans":"Vasos linfáticos","s":1,"notes":[],"orphan":false,"how":"full"},{"j":"O tecido linfoide da garganta e da faringe (as <b>tonsilas</b> e as <b>adenoides</b>) está bem localizado para interceptar antígenos que entram pelo trato respiratório superior.","id":"b4q11","bloco":4,"qn":11,"q":"Quais estruturas da garganta interceptam antígenos provenientes do trato respiratório superior?","o":["Linfonodos","Tonsilas e adenoides","Baço","Timo"],"a":1,"ans":"Tonsilas e adenoides","s":3,"notes":[],"orphan":false,"how":"words"},{"j":"O tecido linfoide nos <b>linfonodos</b> é exposto aos antígenos que invadem os tecidos periféricos do corpo.","id":"b4q12","bloco":4,"qn":12,"q":"Qual estrutura linfoide intercepta antígenos dos tecidos periféricos?","o":["Tonsilas","Timo","Linfonodos","Baço"],"a":2,"ans":"Linfonodos","s":4,"notes":[],"orphan":false,"how":"full"},{"j":"Finalmente, o tecido linfoide do <b>baço</b>, do timo e da medula óssea tem participação específica na interceptação dos agentes antigênicos que tenham conseguido chegar ao sangue circulante.","id":"b4q13","bloco":4,"qn":13,"q":"Qual órgão linfoide é especialmente associado à interceptação de agentes que chegam ao sangue?","o":["Baço","Timo","Linfonodos","Tonsilas"],"a":0,"ans":"Baço","s":5,"notes":[],"orphan":false,"how":"full"},{"j":"Na maioria dos casos, o agente invasor primeiramente penetra nos líquidos teciduais e depois é transportado para linfonodos ou outros tecidos linfoides pelos vasos <b>linfáticos</b>.","id":"b4q14","bloco":4,"qn":14,"q":"Qual sistema corporal transporta antígenos dos líquidos teciduais até estruturas linfoides?","o":["Sistema nervoso","Sistema endócrino","Sistema linfático","Sistema digestório"],"a":2,"ans":"Sistema linfático","s":1,"notes":[],"orphan":false,"how":"words"},{"j":"Por exemplo, o tecido linfoide das paredes <b>gastrointestinais</b> é exposto imediatamente aos antígenos que invadem o intestino.","id":"b4q15","bloco":4,"qn":15,"q":"Qual região do corpo expõe diretamente seus tecidos linfoides aos antígenos intestinais?","o":["Pele","Trato gastrointestinal","Sistema cardiovascular","Sistema nervoso"],"a":1,"ans":"Trato gastrointestinal","s":2,"notes":[],"orphan":false,"how":"words"}]},{"n":21,"part":1,"title":"Duas populações de linfócitos","html":"<span class=\"sn\" data-s=\"0\">&quot;Mediada por Células&quot; ou a <mark class=\"kw\" data-q=\"b6q8\">Imunidade</mark> “<mark class=\"kw\" data-q=\"b6q8\">Humoral</mark>&quot; — os Linfócitos T e B.</span> <span class=\"sn\" data-s=\"1\">Apesar de a maioria do tecido linfoide normal se assemelhar, quando estudado sob o microscópio, essas células se dividem distintivamente em duas grandes populações.</span> <span class=\"sn\" data-s=\"2\">Uma das populações, os linfócitos T, é a responsável pela formação de linfócitos ativados que proporcionam a imunidade “mediada por células”, e a outra população, os <mark class=\"kw\" data-q=\"b6q7\">linfócitos B</mark>, é a responsável pela formação de anticorpos que promovem a imunidade “humoral”.</span>","sents":["&quot;Mediada por Células&quot; ou a Imunidade “Humoral&quot; — os Linfócitos T e B.","Apesar de a maioria do tecido linfoide normal se assemelhar, quando estudado sob o microscópio, essas células se dividem distintivamente em duas grandes populações.","Uma das populações, os linfócitos T, é a responsável pela formação de linfócitos ativados que proporcionam a imunidade “mediada por células”, e a outra população, os linfócitos B, é a responsável pela formação de anticorpos que promovem a imunidade “humoral”."],"fig":"figs/f21.jpg","qs":[{"j":"Uma das populações, os linfócitos T, é a responsável pela formação de linfócitos ativados que proporcionam a imunidade “mediada por células”, e a outra população, os <b>linfócitos B</b>, é a responsável pela formação de anticorpos que promovem a imunidade “humoral”.","id":"b6q7","bloco":6,"qn":7,"q":"Quais linfócitos são especializados na formação de anticorpos?","o":["Macrófagos","Linfócitos T","Linfócitos B","Neutrófilos"],"a":2,"ans":"Linfócitos B","s":2,"notes":[],"orphan":false,"how":"full"},{"j":"&quot;Mediada por Células&quot; ou a <b>Imunidade</b> “<b>Humoral</b>&quot; — os Linfócitos T e B.","id":"b6q8","bloco":6,"qn":8,"q":"Qual tipo de imunidade é promovido pelos linfócitos B?","o":["Imunidade humoral","Imunidade inata","Imunidade passiva","Imunidade celular"],"a":0,"ans":"Imunidade humoral","s":0,"notes":[{"k":"ref","t":"Trecho 30, sobre as diferenças funcionais dos linfócitos B.","n":[30]}],"orphan":false,"how":"words"}]},{"n":22,"part":1,"title":"Origem embrionária dos linfócitos","html":"<span class=\"sn\" data-s=\"0\">Os dois tipos de linfócitos são derivados, originalmente no embrião, de <mark class=\"kw\" data-q=\"b5q1\">células-tronco hematopoiéticas</mark> <mark class=\"kw\" data-q=\"b5q2\">pluripotentes</mark> que formam células progenitoras como um dos mais importantes descendentes, à medida que se diferenciam.</span> <span class=\"sn\" data-s=\"1\">Quase todos os linfócitos formados terminam, com o passar do tempo, no tecido linfoide, mas antes disso eles se diferenciam ainda mais ou são “pré-processados” dos seguintes modos.</span>","sents":["Os dois tipos de linfócitos são derivados, originalmente no embrião, de células-tronco hematopoiéticas pluripotentes que formam células progenitoras como um dos mais importantes descendentes, à medida que se diferenciam.","Quase todos os linfócitos formados terminam, com o passar do tempo, no tecido linfoide, mas antes disso eles se diferenciam ainda mais ou são “pré-processados” dos seguintes modos."],"fig":"figs/f22.jpg","qs":[{"j":"Os dois tipos de linfócitos são derivados, originalmente no embrião, de <b>células-tronco hematopoiéticas</b> pluripotentes que formam células progenitoras como um dos mais importantes descendentes, à medida que se diferenciam.","id":"b5q1","bloco":5,"qn":1,"q":"De quais células se originam inicialmente os linfócitos T e B?","o":["Hemácias maduras","Células-tronco hematopoiéticas","Plaquetas","Neutrófilos"],"a":1,"ans":"Células-tronco hematopoiéticas","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"Os dois tipos de linfócitos são derivados, originalmente no embrião, de células-tronco hematopoiéticas <b>pluripotentes</b> que formam células progenitoras como um dos mais importantes descendentes, à medida que se diferenciam.","id":"b5q2","bloco":5,"qn":2,"q":"Qual característica das células-tronco hematopoiéticas permite sua diferenciação em diversas linhagens?","o":["Especificidade","Pluripotência","Atenuação","Tolerância"],"a":1,"ans":"Pluripotência","s":0,"notes":[],"orphan":false,"how":"manual"}]},{"n":23,"part":1,"title":"Migração dos precursores T para o timo","html":"<span class=\"sn\" data-s=\"0\">As células progenitoras linfoides que se destinam a eventualmente formar linfócitos <mark class=\"kw\" data-q=\"b5q5\">T</mark> ativados migram primeiramente para o <mark class=\"kw\" data-q=\"b4q7 b5q3 b5q5\">timo</mark>, onde são pré-processadas, e por isso são chamadas de linfócitos “<mark class=\"kw\" data-q=\"b5q5\">T</mark>” para designar o papel do <mark class=\"kw\" data-q=\"b4q7 b5q3 b5q5\">timo</mark>.</span> <span class=\"sn\" data-s=\"1\">Elas são responsáveis pela imunidade mediada por células.</span>","sents":["As células progenitoras linfoides que se destinam a eventualmente formar linfócitos T ativados migram primeiramente para o timo, onde são pré-processadas, e por isso são chamadas de linfócitos “T” para designar o papel do timo.","Elas são responsáveis pela imunidade mediada por células."],"fig":"figs/f23.jpg","qs":[{"j":"As células progenitoras linfoides que se destinam a eventualmente formar linfócitos T ativados migram primeiramente para o <b>timo</b>, onde são pré-processadas, e por isso são chamadas de linfócitos “T” para designar o papel do <b>timo</b>.","id":"b4q7","bloco":4,"qn":7,"q":"Qual órgão participa do pré-processamento dos linfócitos T?","o":["Linfonodos","Fígado","Timo","Baço"],"a":2,"ans":"Timo","s":0,"notes":[{"k":"ref","t":"Trecho 19, que inclui o timo entre as localizações dos linfócitos; Trecho 26, que desenvolve seu pré-processamento.","n":[19,26]}],"orphan":false,"how":"full"},{"j":"As células progenitoras linfoides que se destinam a eventualmente formar linfócitos T ativados migram primeiramente para o <b>timo</b>, onde são pré-processadas, e por isso são chamadas de linfócitos “T” para designar o papel do <b>timo</b>.","id":"b5q3","bloco":5,"qn":3,"q":"Qual órgão realiza o pré-processamento dos linfócitos T?","o":["Linfonodos","Timo","Baço","Fígado"],"a":1,"ans":"Timo","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"As células progenitoras linfoides que se destinam a eventualmente formar linfócitos <b>T</b> ativados migram primeiramente para o <b>timo</b>, onde são pré-processadas, e por isso são chamadas de linfócitos “<b>T</b>” para designar o papel do <b>timo</b>.","id":"b5q5","bloco":5,"qn":5,"q":"Qual letra da denominação dos linfócitos T está relacionada ao timo?","o":["Ig","B","NK","T"],"a":3,"ans":"T","s":0,"notes":[],"orphan":false,"how":"full"}]},{"n":24,"part":1,"title":"Pré-processamento B e bursa de Fabricius","html":"<span class=\"sn\" data-s=\"0\">A outra população de linfócitos — os linfócitos B, destinados a formar anticorpos — é pré-processada no <mark class=\"kw\" data-q=\"b6q1\">fígado</mark>, durante a parte média da <mark class=\"kw\" data-q=\"b6q4\">gestação</mark>, e na <mark class=\"kw\" data-q=\"b6q2 b6q3\">medula óssea</mark>, no final da vida fetal e logo após o nascimento.</span> <span class=\"sn\" data-s=\"1\">Essa população celular foi inicialmente identificada em <mark class=\"kw\" data-q=\"b6q6\">aves</mark> que têm um órgão de pré-processamento especial, chamado <mark class=\"kw\" data-q=\"b6q5\">bursa de Fabricius</mark>.</span> <span class=\"sn\" data-s=\"2\">Por esse motivo, esses linfócitos são chamados linfócitos “B”, para indicar o papel da bursa, sendo responsáveis pela imunidade humoral.</span>","sents":["A outra população de linfócitos — os linfócitos B, destinados a formar anticorpos — é pré-processada no fígado, durante a parte média da gestação, e na medula óssea, no final da vida fetal e logo após o nascimento.","Essa população celular foi inicialmente identificada em aves que têm um órgão de pré-processamento especial, chamado bursa de Fabricius.","Por esse motivo, esses linfócitos são chamados linfócitos “B”, para indicar o papel da bursa, sendo responsáveis pela imunidade humoral."],"fig":"figs/f24.jpg","qs":[{"j":"A outra população de linfócitos — os linfócitos B, destinados a formar anticorpos — é pré-processada no <b>fígado</b>, durante a parte média da gestação, e na medula óssea, no final da vida fetal e logo após o nascimento.","id":"b6q1","bloco":6,"qn":1,"q":"Qual órgão realiza o pré-processamento dos linfócitos B durante a metade da gestação?","o":["Timo","Estômago","Fígado","Baço"],"a":2,"ans":"Fígado","s":0,"notes":[],"orphan":false,"how":"full"},{"j":"A
