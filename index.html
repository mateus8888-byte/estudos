<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus estudos</title>
<style>
:root{--bg:#EAF1F9;--surface:#fff;--ink:#0E2142;--ink2:#4F6384;--line:#CFDBEC;--def:#2563EB;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0A1426;--surface:#122039;--ink:#E7EEFB;--ink2:#9DB0CF;--line:#27395E;--def:#6C97FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:24px 16px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15;margin:0}
h2{font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:8px 0 0}
p{margin:0;color:var(--ink2)}
a.card{display:block;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 20px;text-decoration:none;color:inherit}
a.card:hover,a.card:focus-visible{border-color:var(--def);outline:none}
a.card b{display:block;font-size:1.1rem;color:var(--def);margin-bottom:2px}
a.card span{color:var(--ink2)}
a.back{color:var(--def);font-weight:700;text-decoration:none}
</style></head><body><main>
<h1>Meus estudos</h1>
<p>Material para estudar jogando, organizado por matéria.</p>
<h2>Fisiologia</h2>
<a class="card" href="fisiologia/imunidade/"><b>Imunidade</b><span>Capítulo 34: leitura ativa com perguntas e jogo.</span></a>
</main></body></html>
